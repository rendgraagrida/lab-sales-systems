<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><body><th:block th:fragment="fields(form,inquiry)">
<label th:for="${form.id('sourceKey')}">Source key</label><input th:id="${form.id('sourceKey')}" name="sourceKey" required th:readonly="${inquiry != null}" th:value="${form.value('sourceKey',inquiry == null ? '' : inquiry.sourceKey)}" th:attr="aria-invalid=${form.invalid('sourceKey') ? 'true' : null},aria-describedby=${form.invalid('sourceKey') ? form.errorId('sourceKey') : null}"><p th:replace="~{fragments :: fieldError(${form},'sourceKey',0)}"></p>
<label th:for="${form.id('receivedAt')}">Received UTC</label><input th:id="${form.id('receivedAt')}" type="datetime-local" name="receivedAt" required th:value="${form.value('receivedAt',inquiry == null ? '' : #temporals.format(inquiry.receivedAt,'yyyy-MM-dd''T''HH:mm'))}" th:attr="aria-invalid=${form.invalid('receivedAt') ? 'true' : null},aria-describedby=${form.invalid('receivedAt') ? form.errorId('receivedAt') : null}"><p th:replace="~{fragments :: fieldError(${form},'receivedAt',0)}"></p>
<label th:for="${form.id('subject')}">Subject</label><input th:id="${form.id('subject')}" name="subject" required th:value="${form.value('subject',inquiry == null ? '' : inquiry.subject)}" th:attr="aria-invalid=${form.invalid('subject') ? 'true' : null},aria-describedby=${form.invalid('subject') ? form.errorId('subject') : null}"><p th:replace="~{fragments :: fieldError(${form},'subject',0)}"></p>
<label th:for="${form.id('need')}">Need</label><textarea th:id="${form.id('need')}" name="need" th:text="${form.value('need',inquiry == null ? '' : inquiry.need)}" th:attr="aria-invalid=${form.invalid('need') ? 'true' : null},aria-describedby=${form.invalid('need') ? form.errorId('need') : null}"></textarea><p th:replace="~{fragments :: fieldError(${form},'need',0)}"></p>
<label th:for="${form.id('customerId')}">Customer ID (optional)</label><input th:id="${form.id('customerId')}" name="customerId" type="number" min="1" th:value="${form.value('customerId',inquiry == null ? '' : inquiry.customerId)}" th:attr="aria-invalid=${form.invalid('customerId') ? 'true' : null},aria-describedby=${form.invalid('customerId') ? form.errorId('customerId') : null}"><p th:replace="~{fragments :: fieldError(${form},'customerId',0)}"></p>
<label th:for="${form.id('customerVersion')}">Customer version</label><input th:id="${form.id('customerVersion')}" name="customerVersion" type="number" min="1" th:value="${form.value('customerVersion','')}" th:attr="aria-invalid=${form.invalid('customerVersion') ? 'true' : null},aria-describedby=${form.invalid('customerVersion') ? form.errorId('customerVersion') : null}"><p th:replace="~{fragments :: fieldError(${form},'customerVersion',0)}"></p>
<label th:for="${form.id('contactId')}">Contact ID (optional)</label><input th:id="${form.id('contactId')}" name="contactId" type="number" min="1" th:value="${form.value('contactId',inquiry == null ? '' : inquiry.contactId)}" th:attr="aria-invalid=${form.invalid('contactId') ? 'true' : null},aria-describedby=${form.invalid('contactId') ? form.errorId('contactId') : null}"><p th:replace="~{fragments :: fieldError(${form},'contactId',0)}"></p>
<label th:for="${form.id('contactVersion')}">Contact version</label><input th:id="${form.id('contactVersion')}" name="contactVersion" type="number" min="1" th:value="${form.value('contactVersion','')}" th:attr="aria-invalid=${form.invalid('contactVersion') ? 'true' : null},aria-describedby=${form.invalid('contactVersion') ? form.errorId('contactVersion') : null}"><p th:replace="~{fragments :: fieldError(${form},'contactVersion',0)}"></p><label th:for="${form.id('linkVersion')}">Association version</label><input th:id="${form.id('linkVersion')}" name="linkVersion" type="number" min="1" th:value="${form.value('linkVersion','')}" th:attr="aria-invalid=${form.invalid('linkVersion') ? 'true' : null},aria-describedby=${form.invalid('linkVersion') ? form.errorId('linkVersion') : null}"><p th:replace="~{fragments :: fieldError(${form},'linkVersion',0)}"></p>
<label th:for="${form.id('territory')}">Territory</label><input th:id="${form.id('territory')}" name="territory" th:value="${form.value('territory',inquiry == null ? '' : inquiry.territory)}" th:attr="aria-invalid=${form.invalid('territory') ? 'true' : null},aria-describedby=${form.invalid('territory') ? form.errorId('territory') : null}"><p th:replace="~{fragments :: fieldError(${form},'territory',0)}"></p>
<label th:for="${form.id('productLine')}">Product line</label><input th:id="${form.id('productLine')}" name="productLine" th:value="${form.value('productLine',inquiry == null ? '' : inquiry.productLine)}" th:attr="aria-invalid=${form.invalid('productLine') ? 'true' : null},aria-describedby=${form.invalid('productLine') ? form.errorId('productLine') : null}"><p th:replace="~{fragments :: fieldError(${form},'productLine',0)}"></p>
<label th:for="${form.id('priority')}">Priority</label><select th:id="${form.id('priority')}" name="priority" th:attr="aria-invalid=${form.invalid('priority') ? 'true' : null},aria-describedby=${form.invalid('priority') ? form.errorId('priority') : null}"><option th:each="v : ${ {'LOW','NORMAL','HIGH','URGENT'} }" th:value="${v}" th:text="${v}" th:selected="${form.selected('priority',v,inquiry == null ? 'NORMAL' : inquiry.priority)}"></option></select><p th:replace="~{fragments :: fieldError(${form},'priority',0)}"></p>
<label th:for="${form.id('followUpDue')}">Follow-up UTC</label><input th:id="${form.id('followUpDue')}" type="datetime-local" name="followUpDue" th:value="${form.value('followUpDue',inquiry == null or inquiry.followUpDue == null ? '' : #temporals.format(inquiry.followUpDue,'yyyy-MM-dd''T''HH:mm'))}" th:attr="aria-invalid=${form.invalid('followUpDue') ? 'true' : null},aria-describedby=${form.invalid('followUpDue') ? form.errorId('followUpDue') : null}"><p th:replace="~{fragments :: fieldError(${form},'followUpDue',0)}"></p>
</th:block></body></html>
