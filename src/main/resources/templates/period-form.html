<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('New fiscal period')}"></head><body><header th:replace="~{fragments :: header('New fiscal period')}"></header><main id="main"><h1>New fiscal period</h1>
<form method="post" th:action="@{${contextBase} + '/finance/periods/new'}" th:with="form=${feedback.form('period-new',contextBase+'/finance/periods/new')}">
<section th:replace="~{fragments :: formErrors(${form})}"></section>
<label>Code <input name="code" maxlength="80" required th:autofocus="${!form.hasErrors()}" th:id="${form.id('code')}" th:value="${form.value('code','')}" th:attr="aria-invalid=${form.invalid('code') ? 'true' : null},aria-describedby=${form.invalid('code') ? form.errorId('code') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'code', 0)}"></p>
<label>Start date <input type="date" name="startsOn" required th:id="${form.id('startsOn')}" th:value="${form.value('startsOn','')}" th:attr="aria-invalid=${form.invalid('startsOn') ? 'true' : null},aria-describedby=${form.invalid('startsOn') ? form.errorId('startsOn') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'startsOn', 0)}"></p>
<label>End date (inclusive) <input type="date" name="endsOn" required th:id="${form.id('endsOn')}" th:value="${form.value('endsOn','')}" th:attr="aria-invalid=${form.invalid('endsOn') ? 'true' : null},aria-describedby=${form.invalid('endsOn') ? form.errorId('endsOn') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'endsOn', 0)}"></p><button>Create open period</button></form><a th:href="@{${contextBase} + '/finance'}">Back to finance</a><section th:replace="~{fragments :: formFallback(${feedback})}"></section></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
