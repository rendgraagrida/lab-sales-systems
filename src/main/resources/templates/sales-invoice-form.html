<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Sales invoice')}"></head><body><header th:replace="~{fragments :: header('Sales invoice')}"></header><main id="main"><h1>Sales invoice draft</h1><p>Select exact delivered source intervals. To rebill a correction, select its original interval.</p>
<form method="get" th:action="${action}"><label>Number of lines <input type="number" name="count" min="1" max="100" th:value="${lineCount}" required></label><button>Set count</button></form>
<details open><summary>Delivered shipment intervals</summary><ul><li th:each="s : ${sources}" th:text="${'Line '+s.id+' shipment '+s.number+' date '+s.shipment_date+' customer '+s.customer_account_id+' currency '+s.currency+' interval ['+s.slice_start+', '+s.slice_end+')'}"></li></ul></details>
<details><summary>Invoice interval history</summary><p>Each interval is occupied from its invoice date until its reversal date, if any.</p><ul><li th:each="h : ${billingHistory}" th:text="${'Shipment line '+h.shipment_line_id+' interval ['+h.slice_start+', '+h.slice_end+') invoice '+h.reference+' from '+h.invoice_date+' reversed '+(h.reversal_date == null ? 'not reversed' : h.reversal_date)}"></li></ul></details>
<form method="post" th:action="${action}" th:with="form=${feedback.form('sales-invoice',action)}"><section th:replace="~{fragments :: formErrors(${form})}"></section><input type="hidden" name="version" th:id="${form.id('version')}" th:value="${form.value('version',header.version == null ? 0 : header.version)}">
<label>Reference <input name="reference" maxlength="120" required th:id="${form.id('reference')}" th:value="${form.value('reference',header.reference)}" th:attr="aria-invalid=${form.invalid('reference') ? 'true' : null},aria-describedby=${form.invalid('reference') ? form.errorId('reference') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'reference', 0)}"></p>
<label>Invoice date <input type="date" name="invoiceDate" required th:id="${form.id('invoiceDate')}" th:value="${form.value('invoiceDate',header.invoice_date)}" th:attr="aria-invalid=${form.invalid('invoiceDate') ? 'true' : null},aria-describedby=${form.invalid('invoiceDate') ? form.errorId('invoiceDate') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'invoiceDate', 0)}"></p>
<fieldset th:each="i : ${#numbers.sequence(0,lineCount - 1)}" th:with="row=${i &lt; lines.size() ? lines[i] : null}"><legend th:text="${'Line '+(i+1)}"></legend>
<label>Line key <input name="lineKey" maxlength="120" required th:id="${form.id('lineKey',i)}" th:value="${form.value('lineKey',i,row == null ? '' : row.line_key)}" th:attr="aria-invalid=${form.invalid('lineKey',i) ? 'true' : null},aria-describedby=${form.invalid('lineKey',i) ? form.errorId('lineKey',i) : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'lineKey', ${i})}"></p>
<label>Shipment line ID <input type="number" min="1" name="shipmentLineId" required th:id="${form.id('shipmentLineId',i)}" th:value="${form.value('shipmentLineId',i,row == null ? '' : row.shipment_line_id)}" th:attr="aria-invalid=${form.invalid('shipmentLineId',i) ? 'true' : null},aria-describedby=${form.invalid('shipmentLineId',i) ? form.errorId('shipmentLineId',i) : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'shipmentLineId', ${i})}"></p>
<label>Interval start <input type="number" min="0" step="0.000001" name="sliceStart" required th:id="${form.id('sliceStart',i)}" th:value="${form.value('sliceStart',i,row == null ? '' : row.slice_start)}" th:attr="aria-invalid=${form.invalid('sliceStart',i) ? 'true' : null},aria-describedby=${form.invalid('sliceStart',i) ? form.errorId('sliceStart',i) : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'sliceStart', ${i})}"></p>
<label>Interval end <input type="number" min="0" step="0.000001" name="sliceEnd" required th:id="${form.id('sliceEnd',i)}" th:value="${form.value('sliceEnd',i,row == null ? '' : row.slice_end)}" th:attr="aria-invalid=${form.invalid('sliceEnd',i) ? 'true' : null},aria-describedby=${form.invalid('sliceEnd',i) ? form.errorId('sliceEnd',i) : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'sliceEnd', ${i})}"></p></fieldset>
<button>Save draft</button></form><section th:replace="~{fragments :: formFallback(${feedback})}"></section><a th:href="@{${contextBase}+'/sales/invoices'}">Invoices</a></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
