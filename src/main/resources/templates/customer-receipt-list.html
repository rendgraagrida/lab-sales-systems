<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Customer receipts')}"></head><body><header th:replace="~{fragments :: header('Customer receipts')}"></header><main id="main"><h1>Customer receipts</h1><form method="get"><label>Reference <input name="q" th:value="${q}"></label><label>Status <select name="status"><option value="">All</option><option value="DRAFT" th:selected="${status == 'DRAFT'}">Draft</option><option value="POSTED" th:selected="${status == 'POSTED'}">Posted</option></select></label><button>Search</button></form><a th:href="@{${contextBase}+'/finance/customer-receipts/new'}">New receipt</a> <a th:href="@{${contextBase}+'/finance/ar'}">Accounts receivable</a><table><thead><tr><th>Reference</th><th>Customer</th><th>Date</th><th>Amount</th><th>Status</th></tr></thead><tbody><tr th:each="r : ${receipts}"><td><a th:href="@{${contextBase}+'/finance/customer-receipts/'+${r.id}}" th:text="${r.receipt_key}"></a></td><td th:text="${r.customer_account_id}"></td><td th:text="${r.payment_date}"></td><td th:text="${r.amount+' '+r.currency}"></td><td th:text="${r.status}"></td></tr></tbody></table></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
