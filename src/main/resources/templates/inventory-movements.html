<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Stock movements')}"></head><body><header th:replace="~{fragments :: header('Stock movements')}"></header><main id="main">
<p><a th:href="@{${contextBase} + '/inventory'}">Inventory balances</a></p><h2>Movement history</h2><table><thead><tr><th>SKU</th><th>Date</th><th>Warehouse</th><th>Source</th><th>Quantity</th><th th:if="${finance}">Value</th><th>Serial</th><th>Lot</th><th>Expiry</th><th>Sequence</th></tr></thead><tbody><tr th:each="m : ${movements}"><td th:text="${m.sku}"></td><td th:text="${m.postingDate}"></td><td th:text="${m.warehouseCode}"></td><td><a th:if="${m.sourceType == 'INVENTORY_ACTION'}" th:href="@{${contextBase} + '/inventory/actions/' + ${m.sourceId}}" th:text="${m.sourceType + ' ' + m.sourceId}"></a><a th:if="${m.sourceType == 'RECEIPT'}" th:href="@{${contextBase} + '/procurement/receipts/' + ${m.sourceId}}" th:text="${m.sourceType + ' ' + m.sourceId}"></a><span th:if="${m.sourceType != 'INVENTORY_ACTION' and m.sourceType != 'RECEIPT'}" th:text="${m.sourceType + ' ' + m.sourceId}"></span></td><td th:text="${m.quantity}"></td><td th:if="${finance}" th:text="${m.value}"></td><td th:text="${m.serial}"></td><td th:text="${m.lot}"></td><td th:text="${m.expiresOn}"></td><td th:text="${m.poolSequence}"></td></tr></tbody></table>
</main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
