<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Shipment')}"></head><body><header th:replace="~{fragments :: header('Shipment')}"></header><main id="main"><p><a th:href="@{${contextBase} + '/sales/shipments'}">All shipments</a> | <a th:href="@{${contextBase} + '/sales/orders/' + ${shipment.order_id} + '/fulfillment'}">Order fulfillment</a></p><h1 th:text="${shipment.number}"></h1><p th:text="${shipment.status + ' / ' + shipment.shipment_date}"></p><table><thead><tr><th>Order line</th><th>Warehouse</th><th>Quantity</th><th>Original interval</th><th>Net</th></tr></thead><tbody><tr th:each="l : ${shipmentLines}"><td th:text="${l.line_key}"></td><td th:text="${l.warehouse_id}"></td><td th:text="${l.quantity}"></td><td th:text="${l.slice_start == null ? 'Not posted' : l.slice_start + ' - ' + l.slice_end}"></td><td th:text="${l.net}"></td></tr></tbody></table><div th:if="${operations and shipment.status == 'DRAFT'}"><p><a th:href="@{${contextBase} + '/sales/shipments/' + ${shipment.id} + '/edit'}">Edit draft</a></p><form method="post" th:action="@{${contextBase} + '/sales/shipments/' + ${shipment.id} + '/post'}" th:with="url=${contextBase+'/sales/shipments/'+shipment.id+'/post'},form=${feedback.form('shipment-post',url)}"><section th:replace="~{fragments :: formErrors(${form})}"></section><input type="hidden" name="version" th:value="${form.value('version',shipment.version)}"><button>Post shipment</button></form></div><section th:replace="~{fragments :: formFallback(${feedback})}"></section></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
