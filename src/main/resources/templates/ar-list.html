<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Accounts receivable')}"></head><body><header th:replace="~{fragments :: header('Accounts receivable')}"></header><main id="main"><h1>Accounts receivable</h1><form method="get"><label>As of <input type="date" name="asOf" th:value="${asOf}" required></label><button>Show</button></form><a th:href="@{${contextBase}+'/finance/customer-receipts/new'}">New receipt</a><table><thead><tr><th>Invoice</th><th>Customer</th><th>Invoice date</th><th>Due date</th><th>Days overdue</th><th>Outstanding</th></tr></thead><tbody><tr th:each="i : ${invoices}"><td><a th:href="@{${contextBase}+'/sales/invoices/'+${i.id}}" th:text="${i.reference}"></a></td><td th:text="${i.customer_account_id}"></td><td th:text="${i.invoice_date}"></td><td th:text="${i.due_date}"></td><td th:text="${i.days_overdue}"></td><td th:text="${i.open_amount+' '+i.currency}"></td></tr></tbody></table></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
