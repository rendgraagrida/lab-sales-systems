<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Purchase request')}"></head><body><header th:replace="~{fragments :: header('Purchase request')}"></header><main id="main"><p><a th:href="${base}">Back to procurement</a></p><h2 th:text="${purchaseRequest == null ? 'New request' : 'Edit draft'}"></h2>
<form method="post" th:action="${base + '/requests/save'}" th:with="form=${feedback.form('request-save',base+'/requests/save','id',purchaseRequest == null ? '' : purchaseRequest.id)}">
<section th:replace="~{fragments :: formErrors(${form})}"></section><input th:if="${purchaseRequest != null}" type="hidden" name="id" th:value="${form.value('id',purchaseRequest.id)}"><input th:if="${purchaseRequest != null}" type="hidden" name="version" th:value="${form.value('version',purchaseRequest.version)}">
<label th:for="${form.id('businessDate')}">Business date</label><input type="date" name="businessDate" required th:id="${form.id('businessDate')}" th:value="${form.value('businessDate',purchaseRequest == null ? '' : purchaseRequest.businessDate)}" th:attr="aria-invalid=${form.invalid('businessDate') ? 'true' : null},aria-describedby=${form.invalid('businessDate') ? form.errorId('businessDate') : null}"><p th:replace="~{fragments :: fieldError(${form},'businessDate',0)}"></p>
<label th:for="${form.id('purpose')}">Purpose</label><input name="purpose" maxlength="500" required th:id="${form.id('purpose')}" th:value="${form.value('purpose',purchaseRequest == null ? '' : purchaseRequest.purpose)}" th:attr="aria-invalid=${form.invalid('purpose') ? 'true' : null},aria-describedby=${form.invalid('purpose') ? form.errorId('purpose') : null}"><p th:replace="~{fragments :: fieldError(${form},'purpose',0)}"></p>
<p>Enter up to 100 lines. Leave unused rows blank. A line key is a stable identifier within this request.</p><fieldset th:each="i : ${#numbers.sequence(0,99)}" th:with="row=${i &lt; lines.size() ? lines[i] : null}, defaultRef=${row == null ? '' : row.productRef()}, selectedRef=${form.value('productRef',i,defaultRef)}"><legend th:text="${'Line ' + (i+1)}"></legend>
<label th:for="${form.id('lineKey',i)}">Line key</label><input name="lineKey" maxlength="80" th:id="${form.id('lineKey',i)}" th:value="${form.value('lineKey',i,row == null ? '' : row.key)}" th:attr="aria-invalid=${form.invalid('lineKey',i) ? 'true' : null},aria-describedby=${form.invalid('lineKey',i) ? form.errorId('lineKey',i) : null}"><p th:replace="~{fragments :: fieldError(${form},'lineKey',${i})}"></p>
<label th:for="${form.id('productRef',i)}">Product</label><select name="productRef" th:id="${form.id('productRef',i)}" th:attr="aria-invalid=${form.invalid('productRef',i) ? 'true' : null},aria-describedby=${form.invalid('productRef',i) ? form.errorId('productRef',i) : null}"><option value="">Choose product</option><option th:if="${!#strings.isEmpty(selectedRef) and !#lists.contains(products.![id + ':' + version + ':' + settingVersion + ':' + uomVersion],selectedRef)}" th:value="${selectedRef}" selected>Previously selected reference (changed or unavailable)</option><option th:each="product : ${products}" th:value="${product.id + ':' + product.version + ':' + product.settingVersion + ':' + product.uomVersion}" th:text="${product.sku + ' — ' + product.name}" th:selected="${selectedRef == (product.id + ':' + product.version + ':' + product.settingVersion + ':' + product.uomVersion)}"></option></select><p th:replace="~{fragments :: fieldError(${form},'productRef',${i})}"></p>
<label th:for="${form.id('quantity',i)}">Quantity</label><input name="quantity" inputmode="decimal" th:id="${form.id('quantity',i)}" th:value="${form.value('quantity',i,row == null ? '' : row.quantity)}" th:attr="aria-invalid=${form.invalid('quantity',i) ? 'true' : null},aria-describedby=${form.invalid('quantity',i) ? form.errorId('quantity',i) : null}"><p th:replace="~{fragments :: fieldError(${form},'quantity',${i})}"></p></fieldset><button>Save draft</button></form><section th:replace="~{fragments :: formFallback(${feedback})}"></section></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
