<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Shipment draft')}"></head><body><header th:replace="~{fragments :: header('Shipment draft')}"></header><main id="main">
<p><a th:href="@{${contextBase} + '/sales/orders/' + ${order.id} + '/fulfillment'}">Order fulfillment</a></p><h1 th:text="${shipment == null ? 'New shipment' : 'Edit shipment draft'}"></h1><p>Reserve the exact stock for each order line before posting. Save the draft before changing the number of rows.</p>
<form method="get" th:action="${formUrl}"><label for="count">Number of rows</label><input id="count" name="count" type="number" min="1" max="100" th:value="${count}"><button>Show rows</button></form>
<form method="post" th:action="${actionUrl}" th:with="form=${feedback.form('shipment-draft',actionUrl)}">
<section th:replace="~{fragments :: formErrors(${form})}"></section><input type="hidden" name="orderVersion" th:value="${form.value('orderVersion',order.version)}"><input th:if="${shipment != null}" type="hidden" name="version" th:value="${form.value('version',shipment.version)}">
<label for="number">Shipment number / intent key</label><input id="number" name="number" maxlength="120" required th:readonly="${shipment != null}" th:value="${form.value('number',shipment == null ? '' : shipment.number)}">
<label for="date">Shipment date</label><input id="date" name="date" type="date" required th:value="${form.value('date',shipment == null ? '' : shipment.shipment_date)}">
<fieldset th:each="i : ${#numbers.sequence(0,count-1)}" th:with="d=${i lt draftLines.size() ? draftLines[i] : null},oldLine=${d == null ? '' : d.order_line_id + ':' + d.order_line_version},oldWarehouse=${d == null ? '' : d.warehouse_id + ':' + d.warehouse_version}"><legend th:text="${'Shipment row '+(i+1)}"></legend>
<label th:for="${form.id('lineKey',i)}">Line key</label><input th:id="${form.id('lineKey',i)}" name="lineKey" maxlength="120" th:value="${form.value('lineKey',i,d == null ? '' : d.line_key)}">
<label th:for="${form.id('lineId',i)}">Order line and version</label><select th:id="${form.id('lineId',i)}" name="lineId"><option value="">Choose line</option><option th:if="${!#strings.isEmpty(form.value('lineId',i,oldLine)) and !#lists.contains(lines.![id + ':' + version],form.value('lineId',i,oldLine))}" th:value="${form.value('lineId',i,oldLine)}" selected>Original order line reference (changed)</option><option th:each="l : ${lines}" th:value="${l.id+':'+l.version}" th:selected="${form.selected('lineId',i,l.id+':'+l.version,oldLine)}" th:text="${l.line_key+' - '+l.sku+' / reserved '+l.reserved_qty}"></option></select>
<label th:for="${form.id('warehouse',i)}">Warehouse</label><select th:id="${form.id('warehouse',i)}" name="warehouse"><option value="">Choose warehouse</option><option th:if="${!#strings.isEmpty(form.value('warehouse',i,oldWarehouse)) and !#lists.contains(warehouses.![id + ':' + version],form.value('warehouse',i,oldWarehouse))}" th:value="${form.value('warehouse',i,oldWarehouse)}" selected>Original warehouse (changed)</option><option th:each="wh : ${warehouses}" th:value="${wh.id+':'+wh.version}" th:selected="${form.selected('warehouse',i,wh.id+':'+wh.version,oldWarehouse)}" th:text="${wh.code+' - '+wh.name}"></option></select>
<label th:for="${form.id('quantity',i)}">Quantity</label><input th:id="${form.id('quantity',i)}" name="quantity" type="number" step="0.000001" min="0.000001" th:value="${form.value('quantity',i,d == null ? '' : d.quantity)}"><p th:replace="~{fragments :: fieldError(${form},'quantity',${i})}"></p></fieldset>
<button>Save draft</button></form><section th:replace="~{fragments :: formFallback(${feedback})}"></section></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
