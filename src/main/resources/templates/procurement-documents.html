<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Procurement documents')}"></head><body><header th:replace="~{fragments :: header('Procurement documents')}"></header><main id="main"><p><a th:href="${base}">Procurement</a></p><h2 th:text="${mode == 'orders' ? 'Purchase orders' : 'Receipts and service acceptances'}"></h2><form method="get"><label for="search">Search</label><input id="search" name="q" th:value="${q}"><label for="status">Status</label><select id="status" name="status"><option value="">All</option><option th:each="s : ${mode == 'orders' ? {'DRAFT','SUBMITTED','APPROVED','REJECTED'} : {'DRAFT','POSTED'}}" th:value="${s}" th:text="${s}" th:selected="${status == s}"></option></select><button>Search</button></form><p><a th:href="${base + '/' + mode + '/new'}">Create draft</a></p><table><thead><tr><th>Number</th><th>Status</th></tr></thead><tbody><tr th:each="row : ${rows}"><td><a th:href="${base + '/' + mode + '/' + row.id}" th:text="${row.number}"></a></td><td th:text="${row.status}"></td></tr></tbody></table></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
