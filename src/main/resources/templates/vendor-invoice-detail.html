<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Vendor invoice')}"></head><body><header th:replace="~{fragments :: header('Vendor invoice')}"></header><main id="main"><h1 th:text="${invoice.reference}"></h1><p th:text="${invoice.status}"></p><p th:if="${invoice.hold_reason != null}" role="alert" th:text="${invoice.hold_reason}"></p><p th:text="${'Invoice: '+invoice.invoice_date+'; due: '+invoice.due_date+'; currency: '+invoice.currency}"></p><a th:if="${invoice.status != 'POSTED'}" th:href="@{${contextBase}+'/procurement/vendor-invoices/'+${invoice.id}+'/edit'}">Edit draft</a><table><thead><tr><th>Line</th><th>Receipt line</th><th>Quantity</th><th>Unit cost</th><th>Net</th><th>Tax</th><th>Gross</th></tr></thead><tbody><tr th:each="l : ${lines}"><td th:text="${l.line_key}"></td><td><a th:href="@{${contextBase}+'/procurement/receipts/'+${l.receipt_id}}" th:text="${l.receipt_line_id}"></a></td><td th:text="${l.quantity}"></td><td th:text="${l.unit_cost}"></td><td th:text="${l.net}"></td><td th:text="${l.tax}"></td><td th:text="${l.gross}"></td></tr></tbody></table><form th:if="${finance and invoice.status != 'POSTED'}" method="post" th:action="@{${contextBase}+'/procurement/vendor-invoices/'+${invoice.id}+'/match'}" th:with="form=${feedback.form('invoice-match',contextBase+'/procurement/vendor-invoices/'+invoice.id+'/match')}"><section th:replace="~{fragments :: formErrors(${form})}"></section><input type="hidden" name="version" th:value="${form.value('version',invoice.version)}"><button>Match and post</button></form><a th:if="${finance and invoice.journal_id != null}" th:href="@{${contextBase}+'/finance/journals/'+${invoice.journal_id}}">Original journal</a><section th:if="${finance and invoice.status == 'POSTED' and #lists.isEmpty(reversals)}"><h2>Reverse invoice</h2><form method="post" th:action="@{${contextBase}+'/procurement/vendor-invoices/'+${invoice.id}+'/reverse'}" th:with="form=${feedback.form('invoice-reverse',contextBase+'/procurement/vendor-invoices/'+invoice.id+'/reverse')}"><section th:replace="~{fragments :: formErrors(${form})}"></section>
<label>Reversal key <input name="reversalKey" required th:id="${form.id('reversalKey')}" th:value="${form.value('reversalKey','')}" th:attr="aria-invalid=${form.invalid('reversalKey') ? 'true' : null},aria-describedby=${form.invalid('reversalKey') ? form.errorId('reversalKey') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'reversalKey', 0)}"></p>
<label>Reversal date <input type="date" name="reversalDate" required th:id="${form.id('reversalDate')}" th:value="${form.value('reversalDate','')}" th:attr="aria-invalid=${form.invalid('reversalDate') ? 'true' : null},aria-describedby=${form.invalid('reversalDate') ? form.errorId('reversalDate') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'reversalDate', 0)}"></p>
<label>Reason <input name="reason" maxlength="500" required th:id="${form.id('reason')}" th:value="${form.value('reason','')}" th:attr="aria-invalid=${form.invalid('reason') ? 'true' : null},aria-describedby=${form.invalid('reason') ? form.errorId('reason') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'reason', 0)}"></p><button>Reverse</button></form></section><h2>History</h2><ul><li th:each="h : ${history}" th:text="${h.occurred_at+' '+h.action+' '+h.outcome+' '+h.detail}"></li><li th:each="r : ${reversals}" th:text="${'Reversed '+r.reversal_date+': '+r.reason}"></li></ul><section th:replace="~{fragments :: formFallback(${feedback})}"></section><a th:href="@{${contextBase}+'/procurement/vendor-invoices'}">Invoices</a></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
