<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:with="pageTitle=${contactMode ? 'Contacts' : (supplierMode ? 'Suppliers' : (productMode ? 'Products' : (priceMode ? 'Price books' : 'Customers')))}">
<head th:replace="~{fragments :: head(${pageTitle})}"></head><body><header th:replace="~{fragments :: header(${pageTitle})}"></header><main id="main">
<h1 th:text="${contactMode ? 'Contacts' : (supplierMode ? 'Suppliers' : (productMode ? 'Products' : (priceMode ? 'Price books' : 'Customers')))}"></h1><p><a th:href="@{${'/w/' + workspaceId + '/e/' + entityId}}">Back to entity</a></p>
<form method="get" th:action="@{${base}}"><label for="q">Search</label><input id="q" name="q" maxlength="200" th:value="${q}"><button>Search</button></form>
<p><a th:href="@{${base + '/export'}(q=${q})}">Export displayed results as CSV</a></p>
<p><a th:href="@{${base + '/new'}}" th:text="${contactMode ? 'Create contact' : (supplierMode ? 'Create supplier' : (productMode ? 'Create product' : (priceMode ? 'Create price book' : 'Create customer')))}"></a></p>
<table th:unless="${contactMode or supplierMode or productMode or priceMode}"><thead><tr><th>Code</th><th>Name</th><th>Status</th></tr></thead><tbody><tr th:each="customer : ${customers}"><td><a th:href="@{${base + '/' + customer.id}}" th:text="${customer.code}"></a></td><td th:text="${customer.name}"></td><td th:text="${customer.active ? 'Active' : 'Inactive'}"></td></tr></tbody></table>
<table th:if="${contactMode}"><thead><tr><th>Code</th><th>Name</th><th>Status</th></tr></thead><tbody><tr th:each="contact : ${contacts}"><td><a th:href="@{${base + '/' + contact.id}}" th:text="${contact.code}"></a></td><td th:text="${contact.firstName + ' ' + contact.lastName}"></td><td th:text="${contact.active ? 'Active' : 'Inactive'}"></td></tr></tbody></table>
<table th:if="${supplierMode}"><thead><tr><th>Code</th><th>Name</th><th>Status</th></tr></thead><tbody><tr th:each="supplier : ${suppliers}"><td><a th:href="@{${base + '/' + supplier.id}}" th:text="${supplier.code}"></a></td><td th:text="${supplier.name}"></td><td th:text="${supplier.active ? 'Active' : 'Inactive'}"></td></tr></tbody></table>
<table th:if="${productMode}"><thead><tr><th>SKU</th><th>Name</th><th>Status</th></tr></thead><tbody><tr th:each="product : ${products}"><td><a th:href="@{${base + '/' + product.id}}" th:text="${product.sku}"></a></td><td th:text="${product.name}"></td><td th:text="${product.active ? product.status : 'Inactive'}"></td></tr></tbody></table>
<table th:if="${priceMode}"><thead><tr><th>Code</th><th>Name</th><th>Currency</th><th>Status</th></tr></thead><tbody><tr th:each="book : ${books}"><td><a th:href="@{${base + '/' + book.id}}" th:text="${book.code}"></a></td><td th:text="${book.name}"></td><td th:text="${book.currency}"></td><td th:text="${book.status + (book.active ? ' / Active' : ' / Inactive')}"></td></tr></tbody></table>
</main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
