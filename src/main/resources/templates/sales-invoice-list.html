<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Sales invoices')}"></head><body><header th:replace="~{fragments :: header('Sales invoices')}"></header><main id="main"><h1>Sales invoices</h1><form method="get"><label>Reference <input name="q" th:value="${q}"></label><label>Status <select name="status"><option value="">All</option><option value="DRAFT" th:selected="${status == 'DRAFT'}">Draft</option><option value="POSTED" th:selected="${status == 'POSTED'}">Posted</option></select></label><button>Search</button></form><a th:href="@{${contextBase}+'/sales/invoices/new'}">New invoice or rebill</a><table><thead><tr><th>Reference</th><th>Customer account</th><th>Date</th><th>Status</th></tr></thead><tbody><tr th:each="i : ${invoices}"><td><a th:href="@{${contextBase}+'/sales/invoices/'+${i.id}}" th:text="${i.reference}"></a></td><td th:text="${i.customer_account_id}"></td><td th:text="${i.invoice_date}"></td><td th:text="${i.status}"></td></tr></tbody></table></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
