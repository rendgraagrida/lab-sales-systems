<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Asset operators')}"></head><body><header th:replace="~{fragments :: header('Asset operators')}"></header><main id="main"><h2>Link operator</h2><p th:text="${'Asset ' + asset.record_key + ' / owner ' + asset.erp_code}"></p><h3>Linked operators</h3><ul><li th:each="h : ${operatorHistory}" th:text="${h.first_name + ' ' + h.last_name + ' / ' + h.created_at}"></li></ul><form method="post" th:action="${base + '/' + asset.id + '/operators'}" th:with="form=${feedback.form('asset-operator',base+'/'+asset.id+'/operators')}"><section th:replace="~{fragments :: formErrors(${form})}"></section><input type="hidden" name="version" th:value="${form.value('version',asset.version)}">
<label th:for="${form.id('contact')}">Contact linked to the owner</label><select name="contact" required th:id="${form.id('contact')}" th:attr="aria-invalid=${form.invalid('contact') ? 'true' : null},aria-describedby=${form.invalid('contact') ? form.errorId('contact') : null}"><option value="">Choose</option><option th:if="${!#strings.isEmpty(form.value('contact','')) and !#lists.contains(operators.![id + ':' + version],form.value('contact',''))}" th:value="${form.value('contact','')}" selected>Previous reference (changed or unavailable)</option><option th:each="c : ${operators}" th:value="${c.id + ':' + c.version}" th:selected="${form.value('contact','') == c.id + ':' + c.version}" th:text="${c.first_name + ' ' + c.last_name + ' / link version ' + c.link_version}"></option></select><p th:replace="~{fragments :: fieldError(${form},'contact',0)}"></p>
<label th:for="${form.id('linkVersion')}">Contact link version</label><input name="linkVersion" type="number" min="1" required th:id="${form.id('linkVersion')}" th:value="${form.value('linkVersion','')}" th:attr="aria-invalid=${form.invalid('linkVersion') ? 'true' : null},aria-describedby=${form.invalid('linkVersion') ? form.errorId('linkVersion') : null}"><p th:replace="~{fragments :: fieldError(${form},'linkVersion',0)}"></p><button>Link operator</button></form><section th:replace="~{fragments :: formFallback(${feedback})}"></section></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
