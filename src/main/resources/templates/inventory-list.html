<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Inventory')}"></head><body><header th:replace="~{fragments :: header('Inventory')}"></header><main id="main">
<h2>Stock balances</h2><form method="get" th:action="@{${contextBase} + '/inventory'}"><label for="q">Product, warehouse or action</label><input id="q" name="q" maxlength="200" th:value="${q}"><button>Search</button></form>
<table><thead><tr><th>SKU</th><th>Product</th><th>Warehouse</th><th>On hand</th><th>Reserved</th><th th:if="${finance}">Entity pool value</th></tr></thead><tbody><tr th:each="b : ${balances}"><td><a th:href="@{${contextBase} + '/inventory/products/' + ${b.productId} + '/movements'}" th:text="${b.sku}"></a></td><td th:text="${b.productName}"></td><td th:text="${b.warehouseCode}"></td><td th:text="${b.onHand}"></td><td th:text="${b.reserved}"></td><td th:if="${finance}" th:text="${b.poolValue}"></td></tr></tbody></table>
<h2>Inventory actions</h2><p><a th:href="@{${contextBase} + '/inventory/actions/new'}">New inventory action</a></p><table><thead><tr><th>Key</th><th>Kind</th><th>Status</th><th>Quantity</th><th>Date</th></tr></thead><tbody><tr th:each="a : ${actions}"><td><a th:href="@{${contextBase} + '/inventory/actions/' + ${a.id}}" th:text="${a.key}"></a></td><td th:text="${a.kind}"></td><td th:text="${a.status}"></td><td th:text="${a.quantity}"></td><td th:text="${a.date}"></td></tr></tbody></table>
</main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
