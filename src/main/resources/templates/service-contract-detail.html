<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Contract detail')}"></head><body><header th:replace="~{fragments :: header('Contract detail')}"></header><main id="main"><h2 th:text="${contract.record_key}"></h2><p th:text="${'Asset ' + contract.asset_key + ' / serial ' + contract.serial + ' / coverage type ' + contract.coverage_code}"></p><p>Coverage status is derived from the workspace business date. Cancellation is performed through the source order and financial guards, not by invoice correction.</p><h3>Immutable term history</h3><table><thead><tr><th>Term</th><th>Plan</th><th>Coverage start</th><th>Coverage end (exclusive)</th><th>Status</th><th>Source</th><th>Predecessor</th><th>Renewal intent</th></tr></thead><tbody><tr th:each="t : ${terms}"><td th:text="${t.record_key}"></td><td th:text="${t.sku}"></td><td th:text="${t.coverage_start}"></td><td th:text="${t.coverage_end}"></td><td th:text="${t.effective_status}"></td><td th:text="${t.source_kind + ' / ' + (t.source_obligation_id == null ? t.opening_reference : t.source_obligation_id)}"></td><td th:text="${t.predecessor_term_id}"></td><td th:text="${t.renewal_intent_id}"></td></tr></tbody></table></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
