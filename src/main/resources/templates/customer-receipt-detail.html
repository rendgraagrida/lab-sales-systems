<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Customer receipt')}"></head><body><header th:replace="~{fragments :: header('Customer receipt')}"></header><main id="main"><h1 th:text="${'Receipt '+receipt.receipt_key}"></h1><p th:text="${'Status '+receipt.status+'; customer '+receipt.customer_account_id+'; '+receipt.amount+' '+receipt.currency+'; date '+receipt.payment_date}"></p><p th:text="${'Journal: '+(receipt.journal_id == null ? 'none' : receipt.journal_id)}"></p>
<table><thead><tr><th>Invoice</th><th>Amount</th></tr></thead><tbody><tr th:each="a : ${allocations}"><td><a th:href="@{${contextBase}+'/sales/invoices/'+${a.invoice_id}}" th:text="${a.invoice_id}"></a></td><td th:text="${a.amount}"></td></tr></tbody></table>
<div th:if="${receipt.status == 'DRAFT'}"><a th:href="@{${contextBase}+'/finance/customer-receipts/'+${receipt.id}+'/edit'}">Edit draft</a><form method="post" th:action="@{${contextBase}+'/finance/customer-receipts/'+${receipt.id}+'/post'}" th:with="action=${contextBase}+'/finance/customer-receipts/'+${receipt.id}+'/post',form=${feedback.form('receipt-post',action)}"><section th:replace="~{fragments :: formErrors(${form})}"></section><input type="hidden" name="version" th:id="${form.id('version')}" th:value="${form.value('version',receipt.version)}"><button>Post receipt</button></form></div>
<div th:if="${receipt.status == 'POSTED' and reversals.empty}"><h2>Reverse entire receipt</h2><form method="post" th:action="@{${contextBase}+'/finance/customer-receipts/'+${receipt.id}+'/reverse'}" th:with="action=${contextBase}+'/finance/customer-receipts/'+${receipt.id}+'/reverse',form=${feedback.form('receipt-reverse',action)}"><section th:replace="~{fragments :: formErrors(${form})}"></section>
<label>Reversal date <input type="date" name="reversalDate" required th:id="${form.id('reversalDate')}" th:value="${form.value('reversalDate','')}" th:attr="aria-invalid=${form.invalid('reversalDate') ? 'true' : null},aria-describedby=${form.invalid('reversalDate') ? form.errorId('reversalDate') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'reversalDate', 0)}"></p>
<label>Reversal key <input name="reversalKey" maxlength="120" required th:id="${form.id('reversalKey')}" th:value="${form.value('reversalKey','')}" th:attr="aria-invalid=${form.invalid('reversalKey') ? 'true' : null},aria-describedby=${form.invalid('reversalKey') ? form.errorId('reversalKey') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'reversalKey', 0)}"></p>
<label>Reason <input name="reason" maxlength="500" required th:id="${form.id('reason')}" th:value="${form.value('reason','')}" th:attr="aria-invalid=${form.invalid('reason') ? 'true' : null},aria-describedby=${form.invalid('reason') ? form.errorId('reason') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'reason', 0)}"></p><button>Reverse full receipt</button></form></div><ul><li th:each="r : ${reversals}" th:text="${'Reversed '+r.reversal_date+'; reason '+r.reason}"></li></ul><section th:replace="~{fragments :: formFallback(${feedback})}"></section><a th:href="@{${contextBase}+'/finance/customer-receipts'}">Receipts</a></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
