<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Vendor invoices')}"></head><body><header th:replace="~{fragments :: header('Vendor invoices')}"></header><main id="main"><h1>Vendor invoices</h1><form method="get"><label>Reference <input name="q" th:value="${q}"></label><label>Status <select name="status"><option value="">All</option><option th:each="s : ${ {'DRAFT','HELD_FOR_REVIEW','POSTED'} }" th:value="${s}" th:selected="${status == s}" th:text="${s}"></option></select></label><button>Search</button></form><a th:href="@{${contextBase}+'/procurement/vendor-invoices/new'}">New invoice</a><table><thead><tr><th>Reference</th><th>Status</th><th>Date</th><th>Due</th></tr></thead><tbody><tr th:each="i : ${invoices}"><td><a th:href="@{${contextBase}+'/procurement/vendor-invoices/'+${i.id}}" th:text="${i.reference}"></a></td><td th:text="${i.status}"></td><td th:text="${i.invoice_date}"></td><td th:text="${i.due_date}"></td></tr></tbody></table></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
