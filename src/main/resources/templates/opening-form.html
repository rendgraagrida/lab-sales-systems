<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Opening balance')}"></head><body><header th:replace="~{fragments :: header('Opening balance')}"></header><main id="main"><h1>Post opening balance</h1><p>Choose the line count before entering values. Every line must have one positive side; totals must balance.</p><form method="get" th:action="@{${contextBase} + '/finance/openings/new'}"><label>Number of lines <input type="number" name="count" min="2" max="100" th:value="${lineCount}" required></label><button>Set line count</button></form>
<form method="post" th:action="@{${contextBase} + '/finance/openings/new'}" th:with="form=${feedback.form('opening-new',contextBase+'/finance/openings/new')}"><section th:replace="~{fragments :: formErrors(${form})}"></section>
<label>Source key <input name="sourceKey" maxlength="120" required th:id="${form.id('sourceKey')}" th:value="${form.value('sourceKey','')}" th:attr="aria-invalid=${form.invalid('sourceKey') ? 'true' : null},aria-describedby=${form.invalid('sourceKey') ? form.errorId('sourceKey') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'sourceKey', 0)}"></p>
<label>Revision <input type="number" name="revision" min="1" required th:id="${form.id('revision')}" th:value="${form.value('revision',1)}" th:attr="aria-invalid=${form.invalid('revision') ? 'true' : null},aria-describedby=${form.invalid('revision') ? form.errorId('revision') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'revision', 0)}"></p>
<label>Posting date <input type="date" name="date" required th:id="${form.id('date')}" th:value="${form.value('date','')}" th:attr="aria-invalid=${form.invalid('date') ? 'true' : null},aria-describedby=${form.invalid('date') ? form.errorId('date') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'date', 0)}"></p>
<label>Entity currency <input name="currency" readonly th:id="${form.id('currency')}" th:value="${form.value('currency',currency)}" th:attr="aria-invalid=${form.invalid('currency') ? 'true' : null},aria-describedby=${form.invalid('currency') ? form.errorId('currency') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'currency', 0)}"></p>
<label>Description <input name="description" maxlength="500" required th:id="${form.id('description')}" th:value="${form.value('description','')}" th:attr="aria-invalid=${form.invalid('description') ? 'true' : null},aria-describedby=${form.invalid('description') ? form.errorId('description') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'description', 0)}"></p>
<fieldset th:each="i : ${#numbers.sequence(0,lineCount - 1)}"><legend th:text="${'Line ' + (i + 1)}"></legend>
<label>Account <select name="accountId" required th:id="${form.id('accountId',i)}" th:attr="aria-invalid=${form.invalid('accountId',i) ? 'true' : null},aria-describedby=${form.invalid('accountId',i) ? form.errorId('accountId',i) : null}"><option value="" th:if="${form.submitted()}" th:selected="${form.selected('accountId',i,'','')}"></option><option th:each="a : ${accounts}" th:value="${a.id}" th:selected="${form.selected('accountId',i,a.id,null)}" th:text="${a.code + ' ' + a.name}"></option></select></label><p th:replace="~{fragments :: fieldError(${form}, 'accountId', ${i})}"></p>
<label>Debit <input name="debit" type="number" min="0" step="0.01" required th:id="${form.id('debit',i)}" th:value="${form.value('debit',i,0)}" th:attr="aria-invalid=${form.invalid('debit',i) ? 'true' : null},aria-describedby=${form.invalid('debit',i) ? form.errorId('debit',i) : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'debit', ${i})}"></p>
<label>Credit <input name="credit" type="number" min="0" step="0.01" required th:id="${form.id('credit',i)}" th:value="${form.value('credit',i,0)}" th:attr="aria-invalid=${form.invalid('credit',i) ? 'true' : null},aria-describedby=${form.invalid('credit',i) ? form.errorId('credit',i) : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'credit', ${i})}"></p></fieldset><button>Post opening</button></form><a th:href="@{${contextBase} + '/finance'}">Back to finance</a><section th:replace="~{fragments :: formFallback(${feedback})}"></section></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
