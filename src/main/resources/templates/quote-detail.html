<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Quote')}"></head><body><header th:replace="~{fragments :: header('Quote')}"></header><main id="main"><p><a th:href="${base}">Quotes</a></p><h2 th:text="${quote.number}"></h2><p th:text="${'Revision ' + quote.revision + ' - ' + quote.status + ' - ' + quote.origin}"></p><p th:text="${'Valid: ' + quote.business_date + ' through ' + quote.valid_until + ' / ' + quote.currency}"></p><p th:if="${quote.requires_approval}">Independent Sales Manager approval is required.</p><p th:if="${quote.accepted_reference != null}" th:text="${'Customer reference: ' + quote.accepted_reference}"></p><table><thead><tr><th>Key</th><th>Product</th><th>Quantity</th><th>Unit price</th><th>Subtotal</th><th>Discount</th><th>Net</th><th>Tax</th><th>Gross</th></tr></thead><tbody><tr th:each="l : ${lines}"><td th:text="${l.line_key}"></td><td th:text="${l.product_sku + ' - ' + l.product_name}"></td><td th:text="${l.quantity}"></td><td th:text="${l.unit_price}"></td><td th:text="${l.subtotal}"></td><td th:text="${l.discount}"></td><td th:text="${l.net}"></td><td th:text="${l.tax}"></td><td th:text="${l.gross}"></td></tr></tbody></table><section th:if="${!addresses.isEmpty()}"><h3>Document address snapshots</h3><ul><li th:each="a : ${addresses}" th:text="${a.address_role + ' / v' + a.address_version + ' / ' + a.label}"></li></ul></section>
<section><h3>Service targets</h3><p th:if="${#lists.isEmpty(targets)}">No service targets.</p><ul><li th:each="t : ${targets}" th:text="${t.line_key + ' / unit ' + t.unit_no + ' / profile ' + t.service_product_version_id + ' / compatibility ' + t.compatibility_id + ' v' + t.compatibility_version + (t.target_asset_id == null ? ' / device line ' + t.device_line_key + ' unit ' + t.target_device_unit_no : ' / asset ' + t.target_asset_id + ' v' + t.target_asset_version) + ' / ' + t.start_basis + (t.renewal_intent_id == null ? '' : ' / renewal ' + t.renewal_intent_id)}"></li></ul></section>
<p th:if="${quote.status == 'DRAFT'}"><a th:href="${base + '/' + quote.id + '/edit'}">Edit draft</a></p><form th:if="${quote.status == 'DRAFT'}" method="post" th:action="${base + '/' + quote.id + '/submit'}" th:with="form=${feedback.form('quote-submit',base+'/'+quote.id+'/submit')}"><section th:replace="~{fragments :: formErrors(${form})}"></section><input type="hidden" name="version" th:value="${form.value('version',quote.version)}"><button>Submit quote</button></form>
<form th:if="${quote.status == 'SUBMITTED'}" method="post" th:action="${base + '/' + quote.id + '/approve'}" th:with="form=${feedback.form('quote-approve',base+'/'+quote.id+'/approve')}"><section th:replace="~{fragments :: formErrors(${form})}"></section><input type="hidden" name="version" th:value="${form.value('version',quote.version)}"><label th:for="${form.id('reason')}">Approval reason</label><input name="reason" th:id="${form.id('reason')}" th:value="${form.value('reason','')}" th:attr="aria-invalid=${form.invalid('reason') ? 'true' : null},aria-describedby=${form.invalid('reason') ? form.errorId('reason') : null}"><p th:replace="~{fragments :: fieldError(${form},'reason',0)}"></p><button>Approve as independent Sales Manager</button></form>
<form th:if="${quote.status == 'SUBMITTED'}" method="post" th:action="${base + '/' + quote.id + '/reject'}" th:with="form=${feedback.form('quote-reject',base+'/'+quote.id+'/reject')}"><section th:replace="~{fragments :: formErrors(${form})}"></section><input type="hidden" name="version" th:value="${form.value('version',quote.version)}"><label th:for="${form.id('reason')}">Rejection reason</label><input name="reason" required th:id="${form.id('reason')}" th:value="${form.value('reason','')}" th:attr="aria-invalid=${form.invalid('reason') ? 'true' : null},aria-describedby=${form.invalid('reason') ? form.errorId('reason') : null}"><p th:replace="~{fragments :: fieldError(${form},'reason',0)}"></p><button>Reject</button></form>
<form th:if="${quote.status == 'APPROVED'}" method="post" th:action="${base + '/' + quote.id + '/accept'}" th:with="form=${feedback.form('quote-accept',base+'/'+quote.id+'/accept')}"><section th:replace="~{fragments :: formErrors(${form})}"></section><input type="hidden" name="version" th:value="${form.value('version',quote.version)}"><label th:for="${form.id('businessDate')}">Acceptance business date</label><input name="businessDate" type="date" required th:id="${form.id('businessDate')}" th:value="${form.value('businessDate','')}" th:attr="aria-invalid=${form.invalid('businessDate') ? 'true' : null},aria-describedby=${form.invalid('businessDate') ? form.errorId('businessDate') : null}"><p th:replace="~{fragments :: fieldError(${form},'businessDate',0)}"></p><label th:for="${form.id('reference')}">Customer PO or reference</label><input name="reference" required th:id="${form.id('reference')}" th:value="${form.value('reference','')}" th:attr="aria-invalid=${form.invalid('reference') ? 'true' : null},aria-describedby=${form.invalid('reference') ? form.errorId('reference') : null}"><p th:replace="~{fragments :: fieldError(${form},'reference',0)}"></p><button>Record acceptance</button></form>
<form th:if="${quote.status == 'ACCEPTED'}" method="post" th:action="${base + '/' + quote.id + '/withdraw'}" th:with="form=${feedback.form('quote-withdraw',base+'/'+quote.id+'/withdraw')}"><section th:replace="~{fragments :: formErrors(${form})}"></section><input type="hidden" name="version" th:value="${form.value('version',quote.version)}"><label th:for="${form.id('reason')}">Withdrawal reason</label><input name="reason" required th:id="${form.id('reason')}" th:value="${form.value('reason','')}" th:attr="aria-invalid=${form.invalid('reason') ? 'true' : null},aria-describedby=${form.invalid('reason') ? form.errorId('reason') : null}"><p th:replace="~{fragments :: fieldError(${form},'reason',0)}"></p><button>Withdraw before booking</button></form>
<form th:if="${quote.status == 'ACCEPTED'}" method="post" th:action="${base + '/' + quote.id + '/handover'}" th:with="form=${feedback.form('quote-handover',base+'/'+quote.id+'/handover')}"><section th:replace="~{fragments :: formErrors(${form})}"></section><input type="hidden" name="version" th:value="${form.value('version',quote.version)}"><input type="hidden" name="revisionId" th:value="${form.value('revisionId',quote.revision_id)}"><label th:for="${form.id('intent')}">Handover intent</label><input name="intent" required maxlength="200" th:id="${form.id('intent')}" th:value="${form.value('intent','')}" th:attr="aria-invalid=${form.invalid('intent') ? 'true' : null},aria-describedby=${form.invalid('intent') ? form.errorId('intent') : null}"><p th:replace="~{fragments :: fieldError(${form},'intent',0)}"></p><button>Book sales order</button></form>
<form th:if="${quote.status == 'APPROVED' or quote.status == 'REJECTED' or quote.status == 'WITHDRAWN'}" method="post" th:action="${base + '/' + quote.id + '/revise'}" th:with="form=${feedback.form('quote-revise',base+'/'+quote.id+'/revise')}"><section th:replace="~{fragments :: formErrors(${form})}"></section><input type="hidden" name="version" th:value="${form.value('version',quote.version)}"><button>Revise quote</button></form><section th:replace="~{fragments :: formFallback(${feedback})}"></section></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
