<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Supplier payments')}"></head><body><header th:replace="~{fragments :: header('Supplier payments')}"></header><main id="main"><h1>Supplier payments</h1><form method="get"><label>Reference <input name="q" th:value="${q}"></label><label>Status <select name="status"><option value="">All</option><option th:each="s : ${ {'DRAFT','POSTED'} }" th:value="${s}" th:selected="${status == s}" th:text="${s}"></option></select></label><button>Search</button></form><a th:href="@{${contextBase}+'/finance/supplier-payments/new'}">New payment</a><table><thead><tr><th>Reference</th><th>Status</th><th>Date</th><th>Amount</th></tr></thead><tbody><tr th:each="p : ${payments}"><td><a th:href="@{${contextBase}+'/finance/supplier-payments/'+${p.id}}" th:text="${p.payment_key}"></a></td><td th:text="${p.status}"></td><td th:text="${p.payment_date}"></td><td th:text="${p.amount+' '+p.currency}"></td></tr></tbody></table><a th:href="@{${contextBase}+'/finance/ap'}">Accounts payable</a></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
