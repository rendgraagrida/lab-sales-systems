<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Sales invoice')}"></head><body><header th:replace="~{fragments :: header('Sales invoice')}"></header><main id="main"><h1 th:text="${'Invoice '+invoice.reference}"></h1><p th:text="${'Status '+invoice.status+'; customer '+invoice.customer_account_id+'; currency '+invoice.currency+'; due '+invoice.due_date}"></p><p th:text="${'Journal: '+(invoice.journal_id == null ? 'none' : invoice.journal_id)}"></p>
<table><thead><tr><th>Key</th><th>Shipment line</th><th>Original interval</th><th>Discount</th><th>Net</th><th>Tax</th><th>Gross</th></tr></thead><tbody><tr th:each="l : ${lines}"><td th:text="${l.line_key}"></td><td th:text="${l.shipment_line_id}"></td><td th:text="${'['+l.slice_start+', '+l.slice_end+')'}"></td><td th:text="${l.discount}"></td><td th:text="${l.net}"></td><td th:text="${l.tax}"></td><td th:text="${l.gross}"></td></tr></tbody></table>
<div th:if="${invoice.status == 'DRAFT'}"><a th:href="@{${contextBase}+'/sales/invoices/'+${invoice.id}+'/edit'}">Edit draft</a><form method="post" th:action="@{${contextBase}+'/sales/invoices/'+${invoice.id}+'/post'}" th:with="action=${contextBase}+'/sales/invoices/'+${invoice.id}+'/post',form=${feedback.form('invoice-post',action)}"><section th:replace="~{fragments :: formErrors(${form})}"></section><input type="hidden" name="version" th:id="${form.id('version')}" th:value="${form.value('version',invoice.version)}"><button>Post invoice</button></form></div>
<div th:if="${invoice.status == 'POSTED' and reversals.empty}"><h2>Correct invoice</h2><p>Reverse all relevant receipts first. Shipment and stock remain unchanged.</p><form method="post" th:action="@{${contextBase}+'/sales/invoices/'+${invoice.id}+'/reverse'}" th:with="action=${contextBase}+'/sales/invoices/'+${invoice.id}+'/reverse',form=${feedback.form('invoice-reverse',action)}"><section th:replace="~{fragments :: formErrors(${form})}"></section>
<label>Reversal date <input type="date" name="reversalDate" required th:id="${form.id('reversalDate')}" th:value="${form.value('reversalDate','')}" th:attr="aria-invalid=${form.invalid('reversalDate') ? 'true' : null},aria-describedby=${form.invalid('reversalDate') ? form.errorId('reversalDate') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'reversalDate', 0)}"></p>
<label>Reversal key <input name="reversalKey" maxlength="120" required th:id="${form.id('reversalKey')}" th:value="${form.value('reversalKey','')}" th:attr="aria-invalid=${form.invalid('reversalKey') ? 'true' : null},aria-describedby=${form.invalid('reversalKey') ? form.errorId('reversalKey') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'reversalKey', 0)}"></p>
<label>Reason <input name="reason" maxlength="500" required th:id="${form.id('reason')}" th:value="${form.value('reason','')}" th:attr="aria-invalid=${form.invalid('reason') ? 'true' : null},aria-describedby=${form.invalid('reason') ? form.errorId('reason') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'reason', 0)}"></p><button>Reverse invoice</button></form></div><ul><li th:each="r : ${reversals}" th:text="${'Reversed '+r.reversal_date+'; reason '+r.reason}"></li></ul><section th:replace="~{fragments :: formFallback(${feedback})}"></section><a th:href="@{${contextBase}+'/sales/invoices/new'}">New invoice or rebill</a> <a th:href="@{${contextBase}+'/sales/invoices'}">Invoices</a></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
