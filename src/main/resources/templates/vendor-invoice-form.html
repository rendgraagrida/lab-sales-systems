<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Vendor invoice')}"></head><body><header th:replace="~{fragments :: header('Vendor invoice')}"></header><main id="main"><h1>Vendor invoice draft</h1>
<p>Enter the supplier's actual amounts. A mismatch is held for review, not posted. Use the versions shown alongside the receipt sources. The first receipt line supplies the invoice payment-terms snapshot.</p>
<form method="get" th:action="${action}"><label>Number of lines <input type="number" name="count" min="1" max="100" th:value="${lineCount}" required></label><button>Set line count</button></form>
<details><summary>Available posted receipt lines and version tokens</summary><ul><li th:each="s : ${sources}" th:text="${'Receipt line ID '+s.id+' — '+s.number+' / '+s.line_key+', quantity '+s.quantity+', supplier version '+s.supplier_version+', configuration version '+s.config_version}"></li></ul></details>
<form method="post" th:action="${action}" th:with="form=${feedback.form('vendor-invoice',action)}"><section th:replace="~{fragments :: formErrors(${form})}"></section>
<input type="hidden" name="version" th:value="${form.value('version',header.version == null ? 0 : header.version)}">
<label>Supplier reference <input name="reference" required maxlength="200" th:id="${form.id('reference')}" th:value="${form.value('reference',header.reference)}" th:attr="aria-invalid=${form.invalid('reference') ? 'true' : null},aria-describedby=${form.invalid('reference') ? form.errorId('reference') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'reference', 0)}"></p>
<label>Invoice date <input type="date" name="invoiceDate" required th:id="${form.id('invoiceDate')}" th:value="${form.value('invoiceDate',header.invoice_date)}" th:attr="aria-invalid=${form.invalid('invoiceDate') ? 'true' : null},aria-describedby=${form.invalid('invoiceDate') ? form.errorId('invoiceDate') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'invoiceDate', 0)}"></p>
<label>Supplier account version <input type="number" min="1" name="supplierVersion" required th:id="${form.id('supplierVersion')}" th:value="${form.value('supplierVersion',header.supplier_account_version)}" th:attr="aria-invalid=${form.invalid('supplierVersion') ? 'true' : null},aria-describedby=${form.invalid('supplierVersion') ? form.errorId('supplierVersion') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'supplierVersion', 0)}"></p>
<label>Approved configuration version <input type="number" min="1" name="configVersion" required th:id="${form.id('configVersion')}" th:value="${form.value('configVersion',header.config_version)}" th:attr="aria-invalid=${form.invalid('configVersion') ? 'true' : null},aria-describedby=${form.invalid('configVersion') ? form.errorId('configVersion') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'configVersion', 0)}"></p>
<fieldset th:each="i : ${#numbers.sequence(0,lineCount - 1)}" th:with="row=${i &lt; lines.size() ? lines[i] : null}"><legend th:text="${'Line '+(i+1)}"></legend>
<label>Line key <input name="lineKey" required th:id="${form.id('lineKey',i)}" th:value="${form.value('lineKey',i,row == null ? '' : row.line_key)}" th:attr="aria-invalid=${form.invalid('lineKey',i) ? 'true' : null},aria-describedby=${form.invalid('lineKey',i) ? form.errorId('lineKey',i) : null}"></label>
<label>Receipt line ID <input name="receiptLineId" type="number" min="1" required th:id="${form.id('receiptLineId',i)}" th:value="${form.value('receiptLineId',i,row == null ? '' : row.receipt_line_id)}" th:attr="aria-invalid=${form.invalid('receiptLineId',i) ? 'true' : null},aria-describedby=${form.invalid('receiptLineId',i) ? form.errorId('receiptLineId',i) : null}"></label>
<label>Quantity <input name="quantity" type="number" step="0.000001" min="0" required th:id="${form.id('quantity',i)}" th:value="${form.value('quantity',i,row == null ? '' : row.quantity)}" th:attr="aria-invalid=${form.invalid('quantity',i) ? 'true' : null},aria-describedby=${form.invalid('quantity',i) ? form.errorId('quantity',i) : null}"></label>
<label>Unit cost <input name="unitCost" type="number" step="0.000001" min="0" required th:id="${form.id('unitCost',i)}" th:value="${form.value('unitCost',i,row == null ? '' : row.unit_cost)}" th:attr="aria-invalid=${form.invalid('unitCost',i) ? 'true' : null},aria-describedby=${form.invalid('unitCost',i) ? form.errorId('unitCost',i) : null}"></label>
<label>Discount percent (optional) <input name="discountPct" type="number" step="0.0001" min="0" max="100" th:id="${form.id('discountPct',i)}" th:value="${form.value('discountPct',i,row == null ? '' : row.discount_pct)}" th:attr="aria-invalid=${form.invalid('discountPct',i) ? 'true' : null},aria-describedby=${form.invalid('discountPct',i) ? form.errorId('discountPct',i) : null}"></label>
<label>Discount amount method (optional) <input name="discountAmount" type="number" step="0.01" min="0" th:id="${form.id('discountAmount',i)}" th:value="${form.value('discountAmount',i,row == null ? '' : row.discount_amount)}" th:attr="aria-invalid=${form.invalid('discountAmount',i) ? 'true' : null},aria-describedby=${form.invalid('discountAmount',i) ? form.errorId('discountAmount',i) : null}"></label>
<label>Subtotal <input name="subtotal" type="number" step="0.01" min="0" required th:id="${form.id('subtotal',i)}" th:value="${form.value('subtotal',i,row == null ? '' : row.subtotal)}" th:attr="aria-invalid=${form.invalid('subtotal',i) ? 'true' : null},aria-describedby=${form.invalid('subtotal',i) ? form.errorId('subtotal',i) : null}"></label>
<label>Discount <input name="discount" type="number" step="0.01" min="0" required th:id="${form.id('discount',i)}" th:value="${form.value('discount',i,row == null ? '' : row.discount)}" th:attr="aria-invalid=${form.invalid('discount',i) ? 'true' : null},aria-describedby=${form.invalid('discount',i) ? form.errorId('discount',i) : null}"></label>
<label>Net <input name="net" type="number" step="0.01" min="0" required th:id="${form.id('net',i)}" th:value="${form.value('net',i,row == null ? '' : row.net)}" th:attr="aria-invalid=${form.invalid('net',i) ? 'true' : null},aria-describedby=${form.invalid('net',i) ? form.errorId('net',i) : null}"></label>
<label>Tax <input name="tax" type="number" step="0.01" min="0" required th:id="${form.id('tax',i)}" th:value="${form.value('tax',i,row == null ? '' : row.tax)}" th:attr="aria-invalid=${form.invalid('tax',i) ? 'true' : null},aria-describedby=${form.invalid('tax',i) ? form.errorId('tax',i) : null}"></label>
<label>Gross <input name="gross" type="number" step="0.01" min="0" required th:id="${form.id('gross',i)}" th:value="${form.value('gross',i,row == null ? '' : row.gross)}" th:attr="aria-invalid=${form.invalid('gross',i) ? 'true' : null},aria-describedby=${form.invalid('gross',i) ? form.errorId('gross',i) : null}"></label>
<p th:each="field : ${ {'lineKey','receiptLineId','quantity','unitCost','discountPct','discountAmount','subtotal','discount','net','tax','gross'} }" th:if="${form.invalid(field,i)}" th:id="${form.errorId(field,i)}" th:text="${field+': '+form.errorMessage(field,i)}"></p>
</fieldset><button>Save draft</button></form><section th:replace="~{fragments :: formFallback(${feedback})}"></section><a th:href="@{${contextBase}+'/procurement/vendor-invoices'}">Invoices</a></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
