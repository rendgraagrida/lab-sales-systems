<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Accounts payable')}"></head><body><header th:replace="~{fragments :: header('Accounts payable')}"></header><main id="main"><h1>Accounts payable as of date</h1><form method="get"><label>As of <input type="date" name="asOf" required th:value="${asOf}"></label><button>Apply</button></form><table><thead><tr><th>Invoice</th><th>Supplier account</th><th>Invoice date</th><th>Due</th><th>Days overdue</th><th>Open</th></tr></thead><tbody><tr th:each="i : ${invoices}"><td><a th:href="@{${contextBase}+'/procurement/vendor-invoices/'+${i.id}}" th:text="${i.reference}"></a></td><td th:text="${i.supplier_account_id}"></td><td th:text="${i.invoice_date}"></td><td th:text="${i.due_date}"></td><td th:text="${T(java.lang.Math).max(0L,T(java.time.temporal.ChronoUnit).DAYS.between(i.due_date.toLocalDate(),asOf))}"></td><td th:text="${i.open_amount+' '+i.currency}"></td></tr></tbody></table><a th:href="@{${contextBase}+'/finance/supplier-payments'}">Supplier payments</a></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
