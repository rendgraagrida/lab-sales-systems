<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Supplier payment')}"></head><body><header th:replace="~{fragments :: header('Supplier payment')}"></header><main id="main"><h1>Supplier payment draft</h1><p>Allocation totals must exactly equal the payment. No actual bank transfer is made.</p><form method="get" th:action="${action}"><label>Number of allocations <input type="number" name="count" min="1" max="100" th:value="${lineCount}" required></label><button>Set count</button></form>
<details><summary>Supplier accounts and versions</summary><ul><li th:each="s : ${suppliers}" th:text="${'Account '+s.id+', version '+s.version}"></li></ul></details><details><summary>Invoice IDs</summary><ul><li th:each="i : ${invoices}" th:text="${i.id+' — '+i.reference}"></li></ul></details><details><summary>Payment configuration versions</summary><ul><li th:each="c : ${configs}" th:text="${'Configuration '+c.config_version+', bank account '+c.bank_account_version}"></li></ul></details>
<form method="post" th:action="${action}" th:with="form=${feedback.form('supplier-payment',action)}"><section th:replace="~{fragments :: formErrors(${form})}"></section><input type="hidden" name="version" th:value="${form.value('version',header.version == null ? 0 : header.version)}">
<label>Payment reference <input name="paymentKey" required maxlength="120" th:id="${form.id('paymentKey')}" th:value="${form.value('paymentKey',header.payment_key)}" th:attr="aria-invalid=${form.invalid('paymentKey') ? 'true' : null},aria-describedby=${form.invalid('paymentKey') ? form.errorId('paymentKey') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'paymentKey', 0)}"></p>
<label>Supplier account ID <input type="number" min="1" name="supplierAccountId" required th:id="${form.id('supplierAccountId')}" th:value="${form.value('supplierAccountId',header.supplier_account_id)}" th:attr="aria-invalid=${form.invalid('supplierAccountId') ? 'true' : null},aria-describedby=${form.invalid('supplierAccountId') ? form.errorId('supplierAccountId') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'supplierAccountId', 0)}"></p>
<label>Supplier account version <input type="number" min="1" name="supplierVersion" required th:id="${form.id('supplierVersion')}" th:value="${form.value('supplierVersion',header.supplier_account_version)}" th:attr="aria-invalid=${form.invalid('supplierVersion') ? 'true' : null},aria-describedby=${form.invalid('supplierVersion') ? form.errorId('supplierVersion') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'supplierVersion', 0)}"></p>
<label>Bank account version <input type="number" min="1" name="bankAccountVersion" required th:id="${form.id('bankAccountVersion')}" th:value="${form.value('bankAccountVersion',header.bank_account_version)}" th:attr="aria-invalid=${form.invalid('bankAccountVersion') ? 'true' : null},aria-describedby=${form.invalid('bankAccountVersion') ? form.errorId('bankAccountVersion') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'bankAccountVersion', 0)}"></p>
<label>Payment configuration version <input type="number" min="1" name="configVersion" required th:id="${form.id('configVersion')}" th:value="${form.value('configVersion',header.config_version)}" th:attr="aria-invalid=${form.invalid('configVersion') ? 'true' : null},aria-describedby=${form.invalid('configVersion') ? form.errorId('configVersion') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'configVersion', 0)}"></p>
<label>Payment date <input type="date" name="paymentDate" required th:id="${form.id('paymentDate')}" th:value="${form.value('paymentDate',header.payment_date)}" th:attr="aria-invalid=${form.invalid('paymentDate') ? 'true' : null},aria-describedby=${form.invalid('paymentDate') ? form.errorId('paymentDate') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'paymentDate', 0)}"></p>
<label>Currency <input name="currency" readonly th:id="${form.id('currency')}" th:value="${form.value('currency',header.currency == null ? entityCurrency : header.currency)}" th:attr="aria-invalid=${form.invalid('currency') ? 'true' : null},aria-describedby=${form.invalid('currency') ? form.errorId('currency') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'currency', 0)}"></p>
<label>Amount <input type="number" step="0.01" min="0.01" name="amount" required th:id="${form.id('amount')}" th:value="${form.value('amount',header.amount)}" th:attr="aria-invalid=${form.invalid('amount') ? 'true' : null},aria-describedby=${form.invalid('amount') ? form.errorId('amount') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'amount', 0)}"></p>
<fieldset th:each="i : ${#numbers.sequence(0,lineCount - 1)}" th:with="row=${i &lt; lines.size() ? lines[i] : null}"><legend th:text="${'Allocation '+(i+1)}"></legend>
<label>Invoice ID <input type="number" min="1" name="invoiceId" required th:id="${form.id('invoiceId',i)}" th:value="${form.value('invoiceId',i,row == null ? '' : row.invoice_id)}" th:attr="aria-invalid=${form.invalid('invoiceId',i) ? 'true' : null},aria-describedby=${form.invalid('invoiceId',i) ? form.errorId('invoiceId',i) : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'invoiceId', ${i})}"></p>
<label>Allocation amount <input type="number" step="0.01" min="0.01" name="allocationAmount" required th:id="${form.id('allocationAmount',i)}" th:value="${form.value('allocationAmount',i,row == null ? '' : row.amount)}" th:attr="aria-invalid=${form.invalid('allocationAmount',i) ? 'true' : null},aria-describedby=${form.invalid('allocationAmount',i) ? form.errorId('allocationAmount',i) : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'allocationAmount', ${i})}"></p>
</fieldset><button>Save draft</button></form><section th:replace="~{fragments :: formFallback(${feedback})}"></section><a th:href="@{${contextBase}+'/finance/supplier-payments'}">Payments</a></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
