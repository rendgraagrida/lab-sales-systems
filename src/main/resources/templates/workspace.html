<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Choose entity')}"></head><body><header th:replace="~{fragments :: header('Choose entity')}"></header><main id="main"><p>LOCAL_SIMULATION · synthetic data only</p><p><a th:href="@{/workspaces}">All workspaces</a></p><p th:if="${isAdmin}"><a th:href="@{/w/{w}/admin(w=${workspaceId})}">Manage users and entities</a></p><h2>Accessible entities</h2><p th:if="${#lists.isEmpty(entities)}">No entity access has been granted.</p><ul><li th:each="e : ${entities}"><a th:href="@{/w/{w}/e/{e}(w=${workspaceId},e=${e.id})}" th:text="${e.code + ' — ' + e.name + ' (' + e.currency + ')'}">Entity</a></li></ul></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
