<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Journal')}"></head><body><header th:replace="~{fragments :: header('Journal')}"></header><main id="main"><h1>Journal <span th:text="${journal.number}"></span></h1><p><span th:text="${journal.posting_date}"></span> · <span th:text="${journal.currency}"></span> · <span th:text="${journal.state}"></span></p><p th:text="${journal.description}"></p><table><thead><tr><th>Account</th><th>Name</th><th>Debit</th><th>Credit</th></tr></thead><tbody><tr th:each="l : ${lines}"><td th:text="${l.code}"></td><td th:text="${l.name}"></td><td th:text="${l.debit}"></td><td th:text="${l.credit}"></td></tr></tbody></table><a th:href="@{${contextBase} + '/finance'}">Back to finance</a></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
