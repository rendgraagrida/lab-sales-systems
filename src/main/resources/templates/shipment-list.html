<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Shipments')}"></head><body><header th:replace="~{fragments :: header('Shipments')}"></header><main id="main"><h1>Shipments</h1><p>Create a shipment from an order's fulfillment page.</p><table><thead><tr><th>Number</th><th>Order</th><th>Date</th><th>Status</th></tr></thead><tbody><tr th:each="s : ${shipments}"><td><a th:href="@{${contextBase} + '/sales/shipments/' + ${s.id}}" th:text="${s.number}"></a></td><td th:text="${s.order_id}"></td><td th:text="${s.shipment_date}"></td><td th:text="${s.status}"></td></tr></tbody></table></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
