<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('CRM detail')}"></head><body><header th:replace="~{fragments :: header('CRM detail')}"></header><main id="main"><h1>CRM detail</h1><p><a th:href="@{${base}}">Back to CRM</a></p>
<section th:if="${opportunity != null}"><h2 th:text="${opportunity.title}"></h2><p th:text="${'Opportunity '+opportunity.id+'; '+opportunity.pipeline+'; stage '+opportunity.stage+'; version '+opportunity.version}"></p><h3>Stage history</h3><ul><li th:each="e : ${events}" th:text="${e.version+' '+e.stage+' '+e.reason+' actor '+e.actorId+' '+e.occurredAt}"></li></ul><h3>Handover requests</h3><ul><li th:each="r : ${requests}" th:text="${r.id+' '+r.status+' '+r.reasons}"></li></ul><p>Won requests a handover; it does not guarantee an order.</p></section>
<section th:if="${activity != null}"><h2 th:text="${activity.subject}"></h2><p th:text="${'Activity '+activity.id+'; '+activity.kind+'; due '+activity.dueAt+'; completed '+activity.completedAt+'; outcome '+activity.outcome+'; simulated response '+activity.substantiveResponse}"></p><h3>Activity history</h3><ul><li th:each="e : ${activityEvents}" th:text="${e.version+' '+e.action+' '+e.detail+' actor '+e.actorId+' '+e.occurredAt}"></li></ul></section>
<section th:if="${reactivationCase != null}"><h2 th:text="${'Reactivation case '+reactivationCase.id}"></h2><p th:text="${'Customer '+reactivationCase.customerId+'; shipment line '+reactivationCase.shipmentLineId+'; purchase '+reactivationCase.purchaseDate+'; '+reactivationCase.status+'; follow-up '+reactivationCase.activityId}"></p><h3>Evaluation history</h3><ul><li th:each="e : ${evaluations}" th:text="${e.asOf+' rule '+e.ruleId+' '+e.outcome+' '+e.reason}"></li></ul><h3>Case history</h3><ul><li th:each="e : ${caseEvents}" th:text="${e.version+' '+e.kind+' '+e.reason+' actor '+e.actorId+' '+e.occurredAt}"></li></ul></section>
</main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
