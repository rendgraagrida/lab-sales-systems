<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Receipt')}"></head><body><header th:replace="~{fragments :: header('Receipt')}"></header><main id="main"><p><a th:href="${base + '/receipts'}">Back to receipts</a></p><h2 th:text="${receipt.number}"></h2><p th:text="${receipt.kind + ' / ' + receipt.status + ' / ' + receipt.posting_date}"></p><p><a th:href="${base + '/orders/' + receipt.order_id}">Source purchase order</a></p><table><thead><tr><th>Line</th><th>SKU</th><th>Product</th><th>Quantity</th><th>Tracking</th></tr></thead><tbody><tr th:each="line : ${lines}"><td th:text="${line.line_key}"></td><td th:text="${line.product_sku}"></td><td th:text="${line.product_name}"></td><td th:text="${line.slice_end - line.slice_start}"></td><td th:text="${line.tracking}"></td></tr></tbody></table><h3>Tracking</h3><table><thead><tr><th>Line</th><th>Serial</th><th>Lot</th><th>Expiry</th><th>Quantity</th></tr></thead><tbody><tr th:each="track : ${tracks}"><td th:text="${track.line_key}"></td><td th:text="${track.serial}"></td><td th:text="${track.lot}"></td><td th:text="${track.expires_on}"></td><td th:text="${track.quantity}"></td></tr></tbody></table><div th:if="${receipt.status == 'DRAFT'}"><p><a th:href="${base + '/receipts/' + receipt.id + '/edit'}">Edit draft</a></p><form method="post" th:action="${base + '/receipts/' + receipt.id + '/post'}" th:with="form=${feedback.form('receipt-post',base+'/receipts/'+receipt.id+'/post')}"><section th:replace="~{fragments :: formErrors(${form})}"></section><input type="hidden" name="version" th:value="${form.value('version',receipt.version)}"><input type="hidden" name="intent" th:value="${form.value('intent','post')}"><button>Post receipt</button></form></div><section th:replace="~{fragments :: formFallback(${feedback})}"></section></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
