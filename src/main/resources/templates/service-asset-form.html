<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Register asset')}"></head><body><header th:replace="~{fragments :: header('Register asset')}"></header><main id="main"><h2>Register legacy asset</h2><p>Record a real synthetic installation and owner evidence. This does not create stock or a financial posting. Choose an operator linked to the selected customer; the displayed setting and link versions are required.</p><form method="post" th:action="${base + '/register'}" th:with="form=${feedback.form('asset-register',base+'/register')}"><section th:replace="~{fragments :: formErrors(${form})}"></section>
<label th:for="${form.id('customerRef')}">Owner account</label><select name="customerRef" required th:id="${form.id('customerRef')}" th:attr="aria-invalid=${form.invalid('customerRef') ? 'true' : null},aria-describedby=${form.invalid('customerRef') ? form.errorId('customerRef') : null}"><option value="">Choose</option><option th:if="${!#strings.isEmpty(form.value('customerRef','')) and !#lists.contains(customers.![id + ':' + version],form.value('customerRef',''))}" th:value="${form.value('customerRef','')}" selected>Previous reference (changed or unavailable)</option><option th:each="c : ${customers}" th:value="${c.id + ':' + c.version}" th:selected="${form.value('customerRef','') == c.id + ':' + c.version}" th:text="${c.erp_code + ' - ' + c.name}"></option></select><p th:replace="~{fragments :: fieldError(${form},'customerRef',0)}"></p>
<label th:for="${form.id('productRef')}">Device</label><select name="productRef" required th:id="${form.id('productRef')}" th:attr="aria-invalid=${form.invalid('productRef') ? 'true' : null},aria-describedby=${form.invalid('productRef') ? form.errorId('productRef') : null}"><option value="">Choose</option><option th:if="${!#strings.isEmpty(form.value('productRef','')) and !#lists.contains(devices.![id + ':' + version],form.value('productRef',''))}" th:value="${form.value('productRef','')}" selected>Previous reference (changed or unavailable)</option><option th:each="p : ${devices}" th:value="${p.id + ':' + p.version}" th:selected="${form.value('productRef','') == p.id + ':' + p.version}" th:text="${p.sku + ' - ' + p.name + ' / setting version ' + p.setting_version}"></option></select><p th:replace="~{fragments :: fieldError(${form},'productRef',0)}"></p><label th:for="${form.id('settingVersion')}">Device entity setting version</label><input name="settingVersion" type="number" min="1" required th:id="${form.id('settingVersion')}" th:value="${form.value('settingVersion','')}" th:attr="aria-invalid=${form.invalid('settingVersion') ? 'true' : null},aria-describedby=${form.invalid('settingVersion') ? form.errorId('settingVersion') : null}"><p th:replace="~{fragments :: fieldError(${form},'settingVersion',0)}"></p>
<label th:for="${form.id('contact')}">Operator</label><select name="contact" required th:id="${form.id('contact')}" th:attr="aria-invalid=${form.invalid('contact') ? 'true' : null},aria-describedby=${form.invalid('contact') ? form.errorId('contact') : null}"><option value="">Choose</option><option th:if="${!#strings.isEmpty(form.value('contact','')) and !#lists.contains(operators.![id + ':' + version],form.value('contact',''))}" th:value="${form.value('contact','')}" selected>Previous reference (changed or unavailable)</option><option th:each="c : ${operators}" th:value="${c.id + ':' + c.version}" th:selected="${form.value('contact','') == c.id + ':' + c.version}" th:text="${c.first_name + ' ' + c.last_name + ' / owner account ' + c.customer_account_id + ' / link version ' + c.link_version}"></option></select><p th:replace="~{fragments :: fieldError(${form},'contact',0)}"></p><label th:for="${form.id('linkVersion')}">Operator link version</label><input name="linkVersion" type="number" min="1" required th:id="${form.id('linkVersion')}" th:value="${form.value('linkVersion','')}" th:attr="aria-invalid=${form.invalid('linkVersion') ? 'true' : null},aria-describedby=${form.invalid('linkVersion') ? form.errorId('linkVersion') : null}"><p th:replace="~{fragments :: fieldError(${form},'linkVersion',0)}"></p>
<label th:for="${form.id('serial')}">Serial</label><input name="serial" required th:id="${form.id('serial')}" th:value="${form.value('serial','')}" th:attr="aria-invalid=${form.invalid('serial') ? 'true' : null},aria-describedby=${form.invalid('serial') ? form.errorId('serial') : null}"><p th:replace="~{fragments :: fieldError(${form},'serial',0)}"></p><label th:for="${form.id('key')}">Asset record key</label><input name="key" required th:id="${form.id('key')}" th:value="${form.value('key','')}" th:attr="aria-invalid=${form.invalid('key') ? 'true' : null},aria-describedby=${form.invalid('key') ? form.errorId('key') : null}"><p th:replace="~{fragments :: fieldError(${form},'key',0)}"></p><label th:for="${form.id('date')}">Installation date</label><input name="date" type="date" required th:id="${form.id('date')}" th:value="${form.value('date','')}" th:attr="aria-invalid=${form.invalid('date') ? 'true' : null},aria-describedby=${form.invalid('date') ? form.errorId('date') : null}"><p th:replace="~{fragments :: fieldError(${form},'date',0)}"></p><label th:for="${form.id('reason')}">Synthetic installation evidence</label><input name="reason" required th:id="${form.id('reason')}" th:value="${form.value('reason','')}" th:attr="aria-invalid=${form.invalid('reason') ? 'true' : null},aria-describedby=${form.invalid('reason') ? form.errorId('reason') : null}"><p th:replace="~{fragments :: fieldError(${form},'reason',0)}"></p><label th:for="${form.id('intent')}">Registration intent key</label><input name="intent" required th:id="${form.id('intent')}" th:value="${form.value('intent','')}" th:attr="aria-invalid=${form.invalid('intent') ? 'true' : null},aria-describedby=${form.invalid('intent') ? form.errorId('intent') : null}"><p th:replace="~{fragments :: fieldError(${form},'intent',0)}"></p><button>Register asset</button></form><section th:replace="~{fragments :: formFallback(${feedback})}"></section></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
