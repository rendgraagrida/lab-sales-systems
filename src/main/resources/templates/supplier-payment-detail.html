<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Supplier payment')}"></head><body><header th:replace="~{fragments :: header('Supplier payment')}"></header><main id="main"><h1 th:text="${payment.payment_key}"></h1><p th:text="${payment.status+' — '+payment.amount+' '+payment.currency+' on '+payment.payment_date}"></p><a th:if="${payment.status == 'DRAFT'}" th:href="@{${contextBase}+'/finance/supplier-payments/'+${payment.id}+'/edit'}">Edit draft</a><table><thead><tr><th>Invoice</th><th>Amount</th></tr></thead><tbody><tr th:each="a : ${allocations}"><td><a th:href="@{${contextBase}+'/procurement/vendor-invoices/'+${a.invoice_id}}" th:text="${a.invoice_id}"></a></td><td th:text="${a.amount}"></td></tr></tbody></table><form th:if="${payment.status == 'DRAFT'}" method="post" th:action="@{${contextBase}+'/finance/supplier-payments/'+${payment.id}+'/post'}" th:with="form=${feedback.form('payment-post',contextBase+'/finance/supplier-payments/'+payment.id+'/post')}"><section th:replace="~{fragments :: formErrors(${form})}"></section><input type="hidden" name="version" th:value="${form.value('version',payment.version)}"><button>Post payment</button></form><a th:if="${payment.journal_id != null}" th:href="@{${contextBase}+'/finance/journals/'+${payment.journal_id}}">Original journal</a><section th:if="${payment.status == 'POSTED' and #lists.isEmpty(reversals)}"><h2>Reverse entire payment</h2><form method="post" th:action="@{${contextBase}+'/finance/supplier-payments/'+${payment.id}+'/reverse'}" th:with="form=${feedback.form('payment-reverse',contextBase+'/finance/supplier-payments/'+payment.id+'/reverse')}"><section th:replace="~{fragments :: formErrors(${form})}"></section>
<label>Reversal key <input name="reversalKey" required th:id="${form.id('reversalKey')}" th:value="${form.value('reversalKey','')}" th:attr="aria-invalid=${form.invalid('reversalKey') ? 'true' : null},aria-describedby=${form.invalid('reversalKey') ? form.errorId('reversalKey') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'reversalKey', 0)}"></p>
<label>Reversal date <input type="date" name="reversalDate" required th:id="${form.id('reversalDate')}" th:value="${form.value('reversalDate','')}" th:attr="aria-invalid=${form.invalid('reversalDate') ? 'true' : null},aria-describedby=${form.invalid('reversalDate') ? form.errorId('reversalDate') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'reversalDate', 0)}"></p>
<label>Reason <input name="reason" maxlength="500" required th:id="${form.id('reason')}" th:value="${form.value('reason','')}" th:attr="aria-invalid=${form.invalid('reason') ? 'true' : null},aria-describedby=${form.invalid('reason') ? form.errorId('reason') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'reason', 0)}"></p><button>Reverse payment</button></form></section><h2>Reversals</h2><ul><li th:each="r : ${reversals}" th:text="${r.reversal_date+': '+r.reason}"></li></ul><section th:replace="~{fragments :: formFallback(${feedback})}"></section><a th:href="@{${contextBase}+'/finance/supplier-payments'}">Payments</a></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
