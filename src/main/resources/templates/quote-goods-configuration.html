<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Goods configuration')}"></head><body><header th:replace="~{fragments :: header('Goods configuration')}"></header><main id="main"><h2>Goods configuration</h2><p>Manage synthetic compatibility, bundles and customer addresses. Sales Managers maintain product relationships.</p>
<h3>Compatibility</h3><form method="post" th:action="${base + '/compatibility'}" th:with="form=${feedback.form('goods-compatibility',base+'/compatibility')}, firstValue=${form.value('first','')}, secondValue=${form.value('second','')}"><section th:replace="~{fragments :: formErrors(${form})}"></section>
<label th:for="${form.id('first')}">Device</label><select name="first" required th:id="${form.id('first')}" th:attr="aria-invalid=${form.invalid('first') ? 'true' : null},aria-describedby=${form.invalid('first') ? form.errorId('first') : null}"><option value="">Choose</option><option th:if="${!#strings.isEmpty(firstValue) and !#lists.contains(products.?[category == 'LAB_UNIT'].![id + ':' + version],firstValue)}" th:value="${firstValue}" selected>Previous reference (changed or unavailable)</option><option th:each="p : ${products}" th:if="${p.category == 'LAB_UNIT'}" th:value="${p.id + ':' + p.version}" th:selected="${firstValue == p.id + ':' + p.version}" th:text="${p.sku + ' - ' + p.name}"></option></select><p th:replace="~{fragments :: fieldError(${form},'first',0)}"></p>
<label th:for="${form.id('second')}">Compatible component</label><select name="second" required th:id="${form.id('second')}" th:attr="aria-invalid=${form.invalid('second') ? 'true' : null},aria-describedby=${form.invalid('second') ? form.errorId('second') : null}"><option value="">Choose</option><option th:if="${!#strings.isEmpty(secondValue) and !#lists.contains(products.![id + ':' + version],secondValue)}" th:value="${secondValue}" selected>Previous reference (changed or unavailable)</option><option th:each="p : ${products}" th:value="${p.id + ':' + p.version}" th:selected="${secondValue == p.id + ':' + p.version}" th:text="${p.sku + ' - ' + p.name}"></option></select><p th:replace="~{fragments :: fieldError(${form},'second',0)}"></p><button>Add compatibility</button></form><ul><li th:each="c : ${compatibilities}" th:text="${c.device_sku + ' / ' + c.component_sku}"></li></ul>
<h3>Bundles</h3><form method="post" th:action="${base + '/bundle'}" th:with="form=${feedback.form('goods-bundle',base+'/bundle')}, firstValue=${form.value('first','')}, secondValue=${form.value('second','')}"><section th:replace="~{fragments :: formErrors(${form})}"></section>
<label th:for="${form.id('first')}">Bundle product</label><select name="first" required th:id="${form.id('first')}" th:attr="aria-invalid=${form.invalid('first') ? 'true' : null},aria-describedby=${form.invalid('first') ? form.errorId('first') : null}"><option value="">Choose</option><option th:if="${!#strings.isEmpty(firstValue) and !#lists.contains(products.![id + ':' + version],firstValue)}" th:value="${firstValue}" selected>Previous reference (changed or unavailable)</option><option th:each="p : ${products}" th:value="${p.id + ':' + p.version}" th:selected="${firstValue == p.id + ':' + p.version}" th:text="${p.sku + ' - ' + p.name}"></option></select><p th:replace="~{fragments :: fieldError(${form},'first',0)}"></p>
<label th:for="${form.id('second')}">Component</label><select name="second" required th:id="${form.id('second')}" th:attr="aria-invalid=${form.invalid('second') ? 'true' : null},aria-describedby=${form.invalid('second') ? form.errorId('second') : null}"><option value="">Choose</option><option th:if="${!#strings.isEmpty(secondValue) and !#lists.contains(products.![id + ':' + version],secondValue)}" th:value="${secondValue}" selected>Previous reference (changed or unavailable)</option><option th:each="p : ${products}" th:value="${p.id + ':' + p.version}" th:selected="${secondValue == p.id + ':' + p.version}" th:text="${p.sku + ' - ' + p.name}"></option></select><p th:replace="~{fragments :: fieldError(${form},'second',0)}"></p>
<label th:for="${form.id('quantity')}">Quantity per bundle</label><input name="quantity" required th:id="${form.id('quantity')}" th:value="${form.value('quantity','')}" th:attr="aria-invalid=${form.invalid('quantity') ? 'true' : null},aria-describedby=${form.invalid('quantity') ? form.errorId('quantity') : null}"><p th:replace="~{fragments :: fieldError(${form},'quantity',0)}"></p><button>Add component</button></form><ul><li th:each="b : ${bundles}" th:text="${b.bundle_sku + ' / ' + b.component_sku + ' / ' + b.quantity}"></li></ul>
<h3>Synthetic customer addresses</h3><form method="post" th:action="${base + '/address'}" th:with="form=${feedback.form('goods-address',base+'/address')}, customerValue=${form.value('customer','')}"><section th:replace="~{fragments :: formErrors(${form})}"></section>
<label th:for="${form.id('customer')}">Customer account</label><select name="customer" required th:id="${form.id('customer')}" th:attr="aria-invalid=${form.invalid('customer') ? 'true' : null},aria-describedby=${form.invalid('customer') ? form.errorId('customer') : null}"><option value="">Choose</option><option th:if="${!#strings.isEmpty(customerValue) and !#lists.contains(customers.![id + ':' + version],customerValue)}" th:value="${customerValue}" selected>Previous reference (changed or unavailable)</option><option th:each="c : ${customers}" th:value="${c.id + ':' + c.version}" th:selected="${customerValue == c.id + ':' + c.version}" th:text="${c.erp_code + ' - ' + c.name}"></option></select><p th:replace="~{fragments :: fieldError(${form},'customer',0)}"></p>
<label th:for="${form.id('role')}">Role</label><select name="role" th:id="${form.id('role')}" th:attr="aria-invalid=${form.invalid('role') ? 'true' : null},aria-describedby=${form.invalid('role') ? form.errorId('role') : null}"><option value="BILLING" th:selected="${form.selected('role','BILLING','BILLING')}">Billing</option><option value="SHIPPING" th:selected="${form.selected('role','SHIPPING','BILLING')}">Shipping</option></select><p th:replace="~{fragments :: fieldError(${form},'role',0)}"></p>
<label th:for="${form.id('label')}">Synthetic address</label><input name="label" maxlength="500" required th:id="${form.id('label')}" th:value="${form.value('label','')}" th:attr="aria-invalid=${form.invalid('label') ? 'true' : null},aria-describedby=${form.invalid('label') ? form.errorId('label') : null}"><p th:replace="~{fragments :: fieldError(${form},'label',0)}"></p>
<label th:for="${form.id('validFrom')}">Valid from</label><input name="validFrom" type="date" required th:id="${form.id('validFrom')}" th:value="${form.value('validFrom','')}" th:attr="aria-invalid=${form.invalid('validFrom') ? 'true' : null},aria-describedby=${form.invalid('validFrom') ? form.errorId('validFrom') : null}"><p th:replace="~{fragments :: fieldError(${form},'validFrom',0)}"></p><label th:for="${form.id('validTo')}">Valid to (optional)</label><input name="validTo" type="date" th:id="${form.id('validTo')}" th:value="${form.value('validTo','')}" th:attr="aria-invalid=${form.invalid('validTo') ? 'true' : null},aria-describedby=${form.invalid('validTo') ? form.errorId('validTo') : null}"><p th:replace="~{fragments :: fieldError(${form},'validTo',0)}"></p><button>Add address</button></form>
<form method="post" th:action="${base + '/revise-address'}" th:with="form=${feedback.form('goods-address-revise',base+'/revise-address')}, addressValue=${form.value('address','')}"><section th:replace="~{fragments :: formErrors(${form})}"></section>
<label th:for="${form.id('address')}">Address to revise</label><select name="address" required th:id="${form.id('address')}" th:attr="aria-invalid=${form.invalid('address') ? 'true' : null},aria-describedby=${form.invalid('address') ? form.errorId('address') : null}"><option value="">Choose</option><option th:if="${!#strings.isEmpty(addressValue) and !#lists.contains(addresses.![id + ':' + revision],addressValue)}" th:value="${addressValue}" selected>Previous reference (changed or unavailable)</option><option th:each="a : ${addresses}" th:value="${a.id + ':' + a.revision}" th:selected="${addressValue == a.id + ':' + a.revision}" th:text="${a.erp_code + ' / ' + a.address_role + ' / v' + a.revision + ' / ' + a.label}"></option></select><p th:replace="~{fragments :: fieldError(${form},'address',0)}"></p>
<label th:for="${form.id('label')}">New synthetic address</label><input name="label" maxlength="500" required th:id="${form.id('label')}" th:value="${form.value('label','')}" th:attr="aria-invalid=${form.invalid('label') ? 'true' : null},aria-describedby=${form.invalid('label') ? form.errorId('label') : null}"><p th:replace="~{fragments :: fieldError(${form},'label',0)}"></p>
<label th:for="${form.id('validFrom')}">Valid from</label><input name="validFrom" type="date" required th:id="${form.id('validFrom')}" th:value="${form.value('validFrom','')}" th:attr="aria-invalid=${form.invalid('validFrom') ? 'true' : null},aria-describedby=${form.invalid('validFrom') ? form.errorId('validFrom') : null}"><p th:replace="~{fragments :: fieldError(${form},'validFrom',0)}"></p><label th:for="${form.id('validTo')}">Valid to (optional)</label><input name="validTo" type="date" th:id="${form.id('validTo')}" th:value="${form.value('validTo','')}" th:attr="aria-invalid=${form.invalid('validTo') ? 'true' : null},aria-describedby=${form.invalid('validTo') ? form.errorId('validTo') : null}"><p th:replace="~{fragments :: fieldError(${form},'validTo',0)}"></p><button>Save new address version</button></form>
<h4>Address history</h4><ul><li th:each="a : ${addressHistory}" th:text="${a.erp_code + ' / ' + a.address_role + ' / v' + a.revision + ' / ' + a.label + ' / ' + a.valid_from + ' - ' + a.valid_to}"></li></ul><section th:replace="~{fragments :: formFallback(${feedback})}"></section></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
