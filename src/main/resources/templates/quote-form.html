<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Quote draft')}"></head><body><header th:replace="~{fragments :: header('Quote draft')}"></header><main id="main"><p><a th:href="${base}">Quotes</a></p><h2>Quote draft</h2>
<form method="post" th:action="${base + '/save'}" th:with="form=${feedback.form('quote-save',base+'/save','id',quote == null ? '' : quote.id)}"><section th:replace="~{fragments :: formErrors(${form})}"></section><input th:if="${quote != null}" type="hidden" name="id" th:value="${form.value('id',quote.id)}"><input th:if="${quote != null}" type="hidden" name="version" th:value="${form.value('version',quote.version)}"><input type="hidden" name="configVersion" th:value="${form.value('configVersion',configVersion)}">
<label th:for="${form.id('origin')}">Origin</label><select name="origin" th:id="${form.id('origin')}" th:attr="aria-invalid=${form.invalid('origin') ? 'true' : null},aria-describedby=${form.invalid('origin') ? form.errorId('origin') : null}"><option value="DIRECT_ERP" th:selected="${form.selected('origin','DIRECT_ERP',quote == null ? 'DIRECT_ERP' : quote.origin)}">Direct ERP</option><option value="LOCAL_CRM" th:selected="${form.selected('origin','LOCAL_CRM',quote == null ? 'DIRECT_ERP' : quote.origin)}">Local CRM</option></select><p th:replace="~{fragments :: fieldError(${form},'origin',0)}"></p>
<label th:for="${form.id('customerRef')}">Customer account</label><select name="customerRef" required th:id="${form.id('customerRef')}" th:with="selected=${form.value('customerRef',quote == null ? '' : quote.customer_account_id + ':' + quote.customer_account_version)}" th:attr="aria-invalid=${form.invalid('customerRef') ? 'true' : null},aria-describedby=${form.invalid('customerRef') ? form.errorId('customerRef') : null}"><option value="">Choose customer</option><option th:if="${!#strings.isEmpty(selected) and !#lists.contains(customers.![id + ':' + version],selected)}" th:value="${selected}" selected>Previous reference (changed or unavailable)</option><option th:each="c : ${customers}" th:value="${c.id + ':' + c.version}" th:selected="${selected == c.id + ':' + c.version}" th:text="${c.erp_code + ' - ' + c.name}"></option></select><p th:replace="~{fragments :: fieldError(${form},'customerRef',0)}"></p>
<label th:for="${form.id('opportunityId')}">Opportunity (local CRM only)</label><select name="opportunityId" th:id="${form.id('opportunityId')}" th:with="selected=${form.value('opportunityId',quote == null ? '' : quote.opportunity_id)}" th:attr="aria-invalid=${form.invalid('opportunityId') ? 'true' : null},aria-describedby=${form.invalid('opportunityId') ? form.errorId('opportunityId') : null}"><option value="">None</option><option th:if="${!#strings.isEmpty(selected) and !#lists.contains(opportunities.![#strings.toString(id)],selected)}" th:value="${selected}" selected>Previous reference (changed or unavailable)</option><option th:each="o : ${opportunities}" th:value="${o.id}" th:selected="${selected == #strings.toString(o.id)}" th:text="${o.title + ' - ' + o.stage}"></option></select><p th:replace="~{fragments :: fieldError(${form},'opportunityId',0)}"></p>
<p><a th:href="${#strings.replace(base,'/quotes','/goods-configuration')}">Manage goods configuration and synthetic addresses</a></p>
<label th:for="${form.id('billingAddress')}">Billing address (optional)</label><select name="billingAddress" th:id="${form.id('billingAddress')}" th:with="selected=${form.value('billingAddress',quote == null or quote.billing_address_id == null ? '' : quote.billing_address_id + ':' + quote.billing_address_version)}" th:attr="aria-invalid=${form.invalid('billingAddress') ? 'true' : null},aria-describedby=${form.invalid('billingAddress') ? form.errorId('billingAddress') : null}"><option value="">None</option><option th:if="${!#strings.isEmpty(selected) and !#lists.contains(addresses.![id + ':' + version],selected)}" th:value="${selected}" selected>Previous reference (changed or unavailable)</option><option th:each="a : ${addresses}" th:if="${a.address_role == 'BILLING'}" th:value="${a.id + ':' + a.version}" th:selected="${selected == a.id + ':' + a.version}" th:text="${'Account ' + a.customer_account_id + ' / ' + a.label}"></option></select><p th:replace="~{fragments :: fieldError(${form},'billingAddress',0)}"></p>
<label th:for="${form.id('shippingAddress')}">Shipping address (optional)</label><select name="shippingAddress" th:id="${form.id('shippingAddress')}" th:with="selected=${form.value('shippingAddress',quote == null or quote.shipping_address_id == null ? '' : quote.shipping_address_id + ':' + quote.shipping_address_version)}" th:attr="aria-invalid=${form.invalid('shippingAddress') ? 'true' : null},aria-describedby=${form.invalid('shippingAddress') ? form.errorId('shippingAddress') : null}"><option value="">None</option><option th:if="${!#strings.isEmpty(selected) and !#lists.contains(addresses.![id + ':' + version],selected)}" th:value="${selected}" selected>Previous reference (changed or unavailable)</option><option th:each="a : ${addresses}" th:if="${a.address_role == 'SHIPPING'}" th:value="${a.id + ':' + a.version}" th:selected="${selected == a.id + ':' + a.version}" th:text="${'Account ' + a.customer_account_id + ' / ' + a.label}"></option></select><p th:replace="~{fragments :: fieldError(${form},'shippingAddress',0)}"></p>
<label th:for="${form.id('businessDate')}">Business date</label><input type="date" name="businessDate" required th:id="${form.id('businessDate')}" th:value="${form.value('businessDate',quote == null ? '' : quote.business_date)}" th:attr="aria-invalid=${form.invalid('businessDate') ? 'true' : null},aria-describedby=${form.invalid('businessDate') ? form.errorId('businessDate') : null}"><p th:replace="~{fragments :: fieldError(${form},'businessDate',0)}"></p><label th:for="${form.id('validUntil')}">Valid until</label><input type="date" name="validUntil" required th:id="${form.id('validUntil')}" th:value="${form.value('validUntil',quote == null ? '' : quote.valid_until)}" th:attr="aria-invalid=${form.invalid('validUntil') ? 'true' : null},aria-describedby=${form.invalid('validUntil') ? form.errorId('validUntil') : null}"><p th:replace="~{fragments :: fieldError(${form},'validUntil',0)}"></p>
<p>Enter up to 100 lines. Stable line keys must be unique; repeated products are allowed. Select the matching price-book line for each product.</p><fieldset th:each="i : ${#numbers.sequence(0,99)}" th:with="row=${i &lt; lines.size() ? lines[i] : null}, productDefault=${row == null ? '' : row.product_id + ':' + row.product_version + ':' + row.product_setting_version + ':' + row.uom_version}, bookDefault=${row == null ? '' : row.price_book_id + ':' + row.price_book_version + ':' + row.price_book_line_version + ':' + row.product_id}, taxDefault=${row == null ? '' : row.tax_version_id + ':' + row.tax_version_version}, productSelected=${form.value('productRef',i,productDefault)}, bookSelected=${form.value('bookRef',i,bookDefault)}, taxSelected=${form.value('taxRef',i,taxDefault)}"><legend th:text="${'Line ' + (i+1)}"></legend>
<label th:for="${form.id('lineKey',i)}">Line key</label><input name="lineKey" th:id="${form.id('lineKey',i)}" th:value="${form.value('lineKey',i,row == null ? '' : row.line_key)}" th:attr="aria-invalid=${form.invalid('lineKey',i) ? 'true' : null},aria-describedby=${form.invalid('lineKey',i) ? form.errorId('lineKey',i) : null}"><p th:replace="~{fragments :: fieldError(${form},'lineKey',${i})}"></p>
<label th:for="${form.id('productRef',i)}">Product</label><select name="productRef" th:id="${form.id('productRef',i)}" th:attr="aria-invalid=${form.invalid('productRef',i) ? 'true' : null},aria-describedby=${form.invalid('productRef',i) ? form.errorId('productRef',i) : null}"><option value="">Choose product</option><option th:if="${!#strings.isEmpty(productSelected) and !#lists.contains(products.![id + ':' + version + ':' + setting_version + ':' + uom_version],productSelected)}" th:value="${productSelected}" selected>Previous reference (changed or unavailable)</option><option th:each="p : ${products}" th:value="${p.id + ':' + p.version + ':' + p.setting_version + ':' + p.uom_version}" th:selected="${productSelected == p.id + ':' + p.version + ':' + p.setting_version + ':' + p.uom_version}" th:text="${p.sku + ' - ' + p.name}"></option></select><p th:replace="~{fragments :: fieldError(${form},'productRef',${i})}"></p>
<label th:for="${form.id('bookRef',i)}">Price-book line</label><select name="bookRef" th:id="${form.id('bookRef',i)}" th:attr="aria-invalid=${form.invalid('bookRef',i) ? 'true' : null},aria-describedby=${form.invalid('bookRef',i) ? form.errorId('bookRef',i) : null}"><option value="">Choose price</option><option th:if="${!#strings.isEmpty(bookSelected) and !#lists.contains(prices.![id + ':' + version + ':' + line_version + ':' + product_id],bookSelected)}" th:value="${bookSelected}" selected>Previous reference (changed or unavailable)</option><option th:each="p : ${prices}" th:value="${p.id + ':' + p.version + ':' + p.line_version + ':' + p.product_id}" th:selected="${bookSelected == p.id + ':' + p.version + ':' + p.line_version + ':' + p.product_id}" th:text="${p.code + ' / product ' + p.product_id + ' / ' + p.amount}"></option></select><p th:replace="~{fragments :: fieldError(${form},'bookRef',${i})}"></p>
<label th:for="${form.id('quantity',i)}">Quantity</label><input name="quantity" th:id="${form.id('quantity',i)}" th:value="${form.value('quantity',i,row == null ? '' : row.quantity)}" th:attr="aria-invalid=${form.invalid('quantity',i) ? 'true' : null},aria-describedby=${form.invalid('quantity',i) ? form.errorId('quantity',i) : null}"><p th:replace="~{fragments :: fieldError(${form},'quantity',${i})}"></p>
<label th:for="${form.id('overridePrice',i)}">Manual unit price (requires approval)</label><input name="overridePrice" th:id="${form.id('overridePrice',i)}" th:value="${form.value('overridePrice',i,row == null or !row.manual_override ? '' : row.unit_price)}" th:attr="aria-invalid=${form.invalid('overridePrice',i) ? 'true' : null},aria-describedby=${form.invalid('overridePrice',i) ? form.errorId('overridePrice',i) : null}"><p th:replace="~{fragments :: fieldError(${form},'overridePrice',${i})}"></p>
<label th:for="${form.id('discountPct',i)}">Discount percent</label><input name="discountPct" th:id="${form.id('discountPct',i)}" th:value="${form.value('discountPct',i,row == null ? '' : row.discount_pct)}" th:attr="aria-invalid=${form.invalid('discountPct',i) ? 'true' : null},aria-describedby=${form.invalid('discountPct',i) ? form.errorId('discountPct',i) : null}"><p th:replace="~{fragments :: fieldError(${form},'discountPct',${i})}"></p>
<label th:for="${form.id('discountAmount',i)}">Discount amount</label><input name="discountAmount" th:id="${form.id('discountAmount',i)}" th:value="${form.value('discountAmount',i,row == null ? '' : row.discount_amount)}" th:attr="aria-invalid=${form.invalid('discountAmount',i) ? 'true' : null},aria-describedby=${form.invalid('discountAmount',i) ? form.errorId('discountAmount',i) : null}"><p th:replace="~{fragments :: fieldError(${form},'discountAmount',${i})}"></p>
<label th:for="${form.id('taxRef',i)}">Tax</label><select name="taxRef" th:id="${form.id('taxRef',i)}" th:attr="aria-invalid=${form.invalid('taxRef',i) ? 'true' : null},aria-describedby=${form.invalid('taxRef',i) ? form.errorId('taxRef',i) : null}"><option value="">Choose tax</option><option th:if="${!#strings.isEmpty(taxSelected) and !#lists.contains(taxes.![id + ':' + version],taxSelected)}" th:value="${taxSelected}" selected>Previous reference (changed or unavailable)</option><option th:each="t : ${taxes}" th:value="${t.id + ':' + t.version}" th:selected="${taxSelected == t.id + ':' + t.version}" th:text="${t.code + ' / ' + t.rate_pct + '%'}"></option></select><p th:replace="~{fragments :: fieldError(${form},'taxRef',${i})}"></p></fieldset><button>Save draft</button></form><section th:replace="~{fragments :: formFallback(${feedback})}"></section></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
