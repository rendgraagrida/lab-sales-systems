<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Sign in')}"></head><body><header th:replace="~{fragments :: header('Sign in')}"></header><main id="main"><p>Synthetic simulation only; no real customer or financial data.</p><p th:if="${param.error}">Sign-in failed. Check your credentials.</p><p th:if="${param.expired}">Your session has expired. Sign in again.</p><p th:if="${param.logout}">You have signed out.</p><form method="post" th:action="@{/login}"><label for="username">Login</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button></form></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
