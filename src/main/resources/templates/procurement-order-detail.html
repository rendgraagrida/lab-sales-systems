<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Purchase order')}"></head><body><header th:replace="~{fragments :: header('Purchase order')}"></header><main id="main"><p><a th:href="${base + '/orders'}">Back to orders</a></p><h2 th:text="${order.number}"></h2><p th:text="${order.status + ' / revision ' + order.revision + ' / ' + order.currency}"></p><table><thead><tr><th>Line</th><th>SKU</th><th>Quantity</th><th>Unit cost</th><th>Net</th><th>Tax</th><th>Gross</th><th>Source</th></tr></thead><tbody><tr th:each="line : ${lines}"><td th:text="${line.line_key}"></td><td th:text="${line.product_sku}"></td><td th:text="${line.quantity}"></td><td th:text="${line.unit_cost}"></td><td th:text="${line.net}"></td><td th:text="${line.tax}"></td><td th:text="${line.gross}"></td><td><a th:href="${base + '/requests/' + line.request_id}" th:text="${'Request line ' + line.request_line_id}"></a></td></tr></tbody></table><p th:if="${order.status == 'DRAFT'}"><a th:href="${base + '/orders/' + order.id + '/edit'}">Edit draft</a></p><p th:if="${order.status == 'APPROVED'}"><a th:href="${base + '/receipts/new'}">Create receipt or acceptance</a></p><div th:each="action : ${order.status == 'DRAFT' ? {'submit'} : (order.status == 'SUBMITTED' ? {'approve','reject'} : {'revise'})}"><form method="post" th:action="${base + '/orders/' + order.id + '/' + action}" th:with="form=${feedback.form('order-'+action,base+'/orders/'+order.id+'/'+action)}"><section th:replace="~{fragments :: formErrors(${form})}"></section><input type="hidden" name="version" th:value="${form.value('version',order.version)}"><th:block th:if="${action == 'approve' or action == 'reject'}" th:replace="~{procurement-fields :: input(${form},'reason',0,'Decision reason','','text')}"></th:block><button th:text="${action}"></button></form></div><section th:replace="~{fragments :: formFallback(${feedback})}"></section></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
