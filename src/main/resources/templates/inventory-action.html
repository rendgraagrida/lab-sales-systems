<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Inventory action')}"></head><body><header th:replace="~{fragments :: header('Inventory action')}"></header><main id="main">
<p><a th:href="@{${contextBase} + '/inventory'}">Inventory balances</a></p>
<section th:if="${action != null}"><h2 th:text="${action.key + ' — ' + action.status}"></h2><p th:text="${action.kind + ' / quantity ' + action.quantity + ' / ' + action.date}"></p><p th:if="${finance and action.value != null}" th:text="${'Value: ' + action.value}"></p>
<p th:text="${'Product ' + action.productId + ' / from ' + (action.fromWarehouseId == null ? 'none' : action.fromWarehouseId) + ' / to ' + (action.toWarehouseId == null ? 'none' : action.toWarehouseId) + ' / ' + action.tracking}"></p><p th:text="${'Reason: ' + action.reason}"></p><p th:if="${finance and action.journalId != null}"><a th:href="@{${contextBase} + '/finance/journals/' + ${action.journalId}}">View journal</a></p><table th:unless="${#lists.isEmpty(tracks)}"><thead><tr><th>Serial</th><th>Lot</th><th>Expiry</th><th>Quantity</th></tr></thead><tbody><tr th:each="t : ${tracks}"><td th:text="${t.serial}"></td><td th:text="${t.lot}"></td><td th:text="${t.expiresOn}"></td><td th:text="${t.quantity}"></td></tr></tbody></table>
<form th:if="${action.status == 'DRAFT' and action.kind == 'POSITIVE_ADJUSTMENT'}" method="post" th:action="@{${contextBase} + '/inventory/actions/' + ${action.id} + '/submit'}" th:with="form=${feedback.form('action-submit-'+action.id,contextBase+'/inventory/actions/'+action.id+'/submit')}"><section th:replace="~{fragments :: formErrors(${form})}"></section><input type="hidden" name="version" th:value="${form.value('version',action.version)}"><button>Submit for finance approval</button></form>
<form th:if="${(action.status == 'DRAFT' and action.kind != 'POSITIVE_ADJUSTMENT' and operations) or (action.status == 'SUBMITTED' and action.kind == 'POSITIVE_ADJUSTMENT' and finance)}" method="post" th:action="@{${contextBase} + '/inventory/actions/' + ${action.id} + '/post'}" th:with="form=${feedback.form('action-post-'+action.id,contextBase+'/inventory/actions/'+action.id+'/post')}"><section th:replace="~{fragments :: formErrors(${form})}"></section><input type="hidden" name="version" th:value="${form.value('version',action.version)}"><button th:text="${action.kind == 'POSITIVE_ADJUSTMENT' ? 'Approve and post' : 'Post action'}"></button></form></section>
<form th:if="${action == null or action.status == 'DRAFT'}" method="post" th:action="${actionUrl}" th:with="form=${feedback.form('inventory-action',actionUrl)}, originalProduct=${action == null ? '' : action.productId + ':' + action.productVersion + ':' + action.uomId + ':' + action.uomVersion + ':' + action.settingVersion}, originalFrom=${action == null or action.fromWarehouseId == null ? '' : action.fromWarehouseId + ':' + action.fromWarehouseVersion}, originalTo=${action == null or action.toWarehouseId == null ? '' : action.toWarehouseId + ':' + action.toWarehouseVersion}">
<section th:replace="~{fragments :: formErrors(${form})}"></section><h2 th:text="${action == null ? 'New inventory action' : 'Edit draft'}"></h2><input th:if="${action != null}" type="hidden" name="version" th:value="${form.value('version',action.version)}">
<label th:for="${form.id('actionKey')}">Action key</label><input th:id="${form.id('actionKey')}" name="actionKey" maxlength="120" required th:value="${form.value('actionKey',action == null ? '' : action.key)}" th:readonly="${action != null}" th:attr="aria-invalid=${form.invalid('actionKey') ? 'true' : null},aria-describedby=${form.invalid('actionKey') ? form.errorId('actionKey') : null}"><p th:replace="~{fragments :: fieldError(${form},'actionKey',0)}"></p>
<label th:for="${form.id('kind')}">Kind</label><select th:id="${form.id('kind')}" name="kind" th:attr="aria-invalid=${form.invalid('kind') ? 'true' : null},aria-describedby=${form.invalid('kind') ? form.errorId('kind') : null}"><option th:each="k : ${ {'TRANSFER','NEGATIVE_ADJUSTMENT','POSITIVE_ADJUSTMENT'} }" th:value="${k}" th:selected="${form.selected('kind',k,action == null ? 'TRANSFER' : action.kind)}" th:text="${k}"></option></select><p th:replace="~{fragments :: fieldError(${form},'kind',0)}"></p>
<label th:for="${form.id('product')}">Product and reference version</label><select th:id="${form.id('product')}" name="product" required th:attr="aria-invalid=${form.invalid('product') ? 'true' : null},aria-describedby=${form.invalid('product') ? form.errorId('product') : null}"><option value="">Choose product</option><option th:if="${!#strings.isEmpty(form.value('product',originalProduct)) and !#lists.contains(products.![id + ':' + version + ':' + uom_id + ':' + uom_version + ':' + setting_version],form.value('product',originalProduct))}" th:value="${form.value('product',originalProduct)}" selected>Original product reference (changed or unavailable)</option><option th:each="p : ${products}" th:value="${p.id + ':' + p.version + ':' + p.uom_id + ':' + p.uom_version + ':' + p.setting_version}" th:selected="${form.selected('product',p.id + ':' + p.version + ':' + p.uom_id + ':' + p.uom_version + ':' + p.setting_version,originalProduct)}" th:text="${p.sku + ' ' + p.name}"></option></select><p th:replace="~{fragments :: fieldError(${form},'product',0)}"></p>
<label th:for="${form.id('fromWarehouse')}">From warehouse</label><select th:id="${form.id('fromWarehouse')}" name="fromWarehouse" th:attr="aria-invalid=${form.invalid('fromWarehouse') ? 'true' : null},aria-describedby=${form.invalid('fromWarehouse') ? form.errorId('fromWarehouse') : null}"><option value="">None</option><option th:if="${!#strings.isEmpty(form.value('fromWarehouse',originalFrom)) and !#lists.contains(warehouses.![id + ':' + version],form.value('fromWarehouse',originalFrom))}" th:value="${form.value('fromWarehouse',originalFrom)}" selected>Original warehouse (changed or unavailable)</option><option th:each="w : ${warehouses}" th:value="${w.id + ':' + w.version}" th:selected="${form.selected('fromWarehouse',w.id + ':' + w.version,originalFrom)}" th:text="${w.code + ' ' + w.name}"></option></select><p th:replace="~{fragments :: fieldError(${form},'fromWarehouse',0)}"></p>
<label th:for="${form.id('toWarehouse')}">To warehouse</label><select th:id="${form.id('toWarehouse')}" name="toWarehouse" th:attr="aria-invalid=${form.invalid('toWarehouse') ? 'true' : null},aria-describedby=${form.invalid('toWarehouse') ? form.errorId('toWarehouse') : null}"><option value="">None</option><option th:if="${!#strings.isEmpty(form.value('toWarehouse',originalTo)) and !#lists.contains(warehouses.![id + ':' + version],form.value('toWarehouse',originalTo))}" th:value="${form.value('toWarehouse',originalTo)}" selected>Original warehouse (changed or unavailable)</option><option th:each="w : ${warehouses}" th:value="${w.id + ':' + w.version}" th:selected="${form.selected('toWarehouse',w.id + ':' + w.version,originalTo)}" th:text="${w.code + ' ' + w.name}"></option></select><p th:replace="~{fragments :: fieldError(${form},'toWarehouse',0)}"></p>
<label th:for="${form.id('quantity')}">Quantity</label><input th:id="${form.id('quantity')}" name="quantity" type="number" step="0.000001" min="0.000001" required th:value="${form.value('quantity',action == null ? '' : action.quantity)}" th:attr="aria-invalid=${form.invalid('quantity') ? 'true' : null},aria-describedby=${form.invalid('quantity') ? form.errorId('quantity') : null}"><p th:replace="~{fragments :: fieldError(${form},'quantity',0)}"></p>
<label th:for="${form.id('value')}">Positive adjustment total cost (leave blank for transfer or negative adjustment)</label><input th:id="${form.id('value')}" name="value" type="number" step="0.01" min="0" th:value="${form.value('value',action == null or !finance ? '' : action.value)}" th:attr="aria-invalid=${form.invalid('value') ? 'true' : null},aria-describedby=${form.invalid('value') ? form.errorId('value') : null}"><p th:replace="~{fragments :: fieldError(${form},'value',0)}"></p>
<label th:for="${form.id('date')}">Posting date</label><input th:id="${form.id('date')}" name="date" type="date" required th:value="${form.value('date',action == null ? '' : action.date)}" th:attr="aria-invalid=${form.invalid('date') ? 'true' : null},aria-describedby=${form.invalid('date') ? form.errorId('date') : null}"><p th:replace="~{fragments :: fieldError(${form},'date',0)}"></p><label th:for="${form.id('reason')}">Reason</label><input th:id="${form.id('reason')}" name="reason" maxlength="500" required th:value="${form.value('reason',action == null ? '' : action.reason)}" th:attr="aria-invalid=${form.invalid('reason') ? 'true' : null},aria-describedby=${form.invalid('reason') ? form.errorId('reason') : null}"><p th:replace="~{fragments :: fieldError(${form},'reason',0)}"></p>
<details th:open="${form.hasErrors()}"><summary>Tracking rows (up to 100)</summary><p>For serials enter one unit per row. For lots enter lot, quantity and expiry when required. Leave unused rows blank.</p><fieldset th:each="i : ${#numbers.sequence(0,count-1)}" th:with="t=${i lt tracks.size() ? tracks[i] : null}"><legend th:text="${'Tracking row ' + (i+1)}"></legend><label th:for="${form.id('serial',i)}">Serial</label><input th:id="${form.id('serial',i)}" name="serial" maxlength="200" th:value="${form.value('serial',i,t == null ? '' : t.serial)}" th:attr="aria-invalid=${form.invalid('serial',i) ? 'true' : null},aria-describedby=${form.invalid('serial',i) ? form.errorId('serial',i) : null}"><p th:replace="~{fragments :: fieldError(${form},'serial',${i})}"></p><label th:for="${form.id('lot',i)}">Lot</label><input th:id="${form.id('lot',i)}" name="lot" maxlength="200" th:value="${form.value('lot',i,t == null ? '' : t.lot)}" th:attr="aria-invalid=${form.invalid('lot',i) ? 'true' : null},aria-describedby=${form.invalid('lot',i) ? form.errorId('lot',i) : null}"><p th:replace="~{fragments :: fieldError(${form},'lot',${i})}"></p><label th:for="${form.id('expiresOn',i)}">Expiry</label><input th:id="${form.id('expiresOn',i)}" name="expiresOn" type="date" th:value="${form.value('expiresOn',i,t == null ? '' : t.expiresOn)}" th:attr="aria-invalid=${form.invalid('expiresOn',i) ? 'true' : null},aria-describedby=${form.invalid('expiresOn',i) ? form.errorId('expiresOn',i) : null}"><p th:replace="~{fragments :: fieldError(${form},'expiresOn',${i})}"></p><label th:for="${form.id('trackingQuantity',i)}">Tracking quantity</label><input th:id="${form.id('trackingQuantity',i)}" name="trackingQuantity" type="number" step="0.000001" min="0" th:value="${form.value('trackingQuantity',i,t == null ? '' : t.quantity)}" th:attr="aria-invalid=${form.invalid('trackingQuantity',i) ? 'true' : null},aria-describedby=${form.invalid('trackingQuantity',i) ? form.errorId('trackingQuantity',i) : null}"><p th:replace="~{fragments :: fieldError(${form},'trackingQuantity',${i})}"></p></fieldset></details><button>Save draft</button></form>
<section th:replace="~{fragments :: formFallback(${feedback})}"></section></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
