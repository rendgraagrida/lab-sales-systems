<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Order fulfillment')}"></head><body><header th:replace="~{fragments :: header('Order fulfillment')}"></header><main id="main">
<p><a th:href="@{${contextBase} + '/sales/orders/' + ${order.id}}">Order detail</a> | <a th:href="@{${contextBase} + '/sales/shipments'}">Shipments</a></p>
<h1 th:text="${'Fulfillment: ' + order.number}"></h1><p>Reservations reduce available stock, not on-hand stock. Ship only stock reserved for this order line.</p>
<p th:if="${operations}"><a th:href="@{${contextBase} + '/sales/orders/' + ${order.id} + '/shipments/new'}">New shipment</a></p>
<section th:each="line : ${lines}"><h2 th:text="${line.line_key + ' - ' + line.sku}"></h2><p th:text="${'Ordered ' + line.quantity + ', fulfilled ' + line.fulfilled_qty + ', cancelled ' + line.cancelled_qty + ', reserved ' + line.reserved_qty + ', tracking ' + line.tracking}"></p>
<form th:if="${operations and (line.product_category == 'LAB_UNIT' or line.product_category == 'LAB_SUPPLY' or line.product_category == 'REPLACEMENT_PART')}" method="post" th:action="@{${contextBase} + '/sales/orders/' + ${order.id} + '/fulfillment/reserve'}" th:with="url=${contextBase+'/sales/orders/'+order.id+'/fulfillment/reserve'},form=${feedback.form('reserve-'+line.id,url)}">
<section th:replace="~{fragments :: formErrors(${form})}"></section><input type="hidden" name="orderVersion" th:value="${form.value('orderVersion',order.version)}"><input type="hidden" name="lineId" th:value="${line.id}"><input type="hidden" name="lineVersion" th:value="${form.value('lineVersion',line.version)}">
<label th:for="${'warehouse-'+line.id}">Warehouse</label><select th:id="${'warehouse-'+line.id}" name="warehouse" required><option value="">Choose warehouse</option><option th:each="wh : ${warehouses}" th:value="${wh.id+':'+wh.version}" th:selected="${form.selected('warehouse',wh.id+':'+wh.version,'')}" th:text="${wh.code+' - '+wh.name}"></option></select>
<label th:for="${'serial-'+line.id}">Serial, for serial tracking only</label><select th:id="${'serial-'+line.id}" name="serialId"><option value="">None</option><option th:each="t : ${tracking}" th:if="${t.kind == 'SERIAL' and t.product_id == line.product_id}" th:value="${t.id}" th:selected="${form.selected('serialId',t.id,'')}" th:text="${t.label+' / warehouse '+t.warehouse_id}"></option></select>
<label th:for="${'lot-'+line.id}">Lot, for lot tracking only</label><select th:id="${'lot-'+line.id}" name="lotId"><option value="">None</option><option th:each="t : ${tracking}" th:if="${t.kind == 'LOT' and t.product_id == line.product_id}" th:value="${t.id}" th:selected="${form.selected('lotId',t.id,'')}" th:text="${t.label+' / warehouse '+t.warehouse_id}"></option></select>
<label th:for="${'reserve-quantity-'+line.id}">Quantity</label><input th:id="${'reserve-quantity-'+line.id}" name="quantity" type="number" step="0.000001" min="0.000001" required th:value="${form.value('quantity','')}"><label th:for="${'reserve-intent-'+line.id}">Unique reservation key</label><input th:id="${'reserve-intent-'+line.id}" name="intent" maxlength="120" required th:value="${form.value('intent','')}"><button>Reserve stock</button></form>
<form th:if="${operations}" method="post" th:action="@{${contextBase} + '/sales/orders/' + ${order.id} + '/fulfillment/cancel'}" th:with="url=${contextBase+'/sales/orders/'+order.id+'/fulfillment/cancel'},form=${feedback.form('cancel-'+line.id,url)}">
<section th:replace="~{fragments :: formErrors(${form})}"></section><input type="hidden" name="orderVersion" th:value="${form.value('orderVersion',order.version)}"><input type="hidden" name="lineId" th:value="${line.id}"><input type="hidden" name="lineVersion" th:value="${form.value('lineVersion',line.version)}">
<label th:for="${'cancel-quantity-'+line.id}">Unfulfilled quantity to cancel</label><input th:id="${'cancel-quantity-'+line.id}" name="quantity" type="number" step="0.000001" min="0.000001" required th:value="${form.value('quantity','')}"><label th:for="${'cancel-reason-'+line.id}">Reason</label><input th:id="${'cancel-reason-'+line.id}" name="reason" maxlength="500" required th:value="${form.value('reason','')}"><label th:for="${'cancel-intent-'+line.id}">Unique cancellation key</label><input th:id="${'cancel-intent-'+line.id}" name="intent" maxlength="120" required th:value="${form.value('intent','')}"><button>Cancel unfulfilled quantity</button></form>
<div th:each="r : ${reservations}" th:if="${r.order_line_id == line.id and r.quantity > r.released_qty + r.consumed_qty}"><p th:text="${'Reservation '+r.id+' / warehouse '+r.warehouse_id+' / remaining '+(r.quantity-r.released_qty-r.consumed_qty)+' / '+(r.serial == null ? (r.lot == null ? 'untracked' : r.lot) : r.serial)}"></p>
<form th:if="${operations}" method="post" th:action="@{${contextBase} + '/sales/orders/' + ${order.id} + '/fulfillment/release'}" th:with="url=${contextBase+'/sales/orders/'+order.id+'/fulfillment/release'},form=${feedback.form('release-'+r.id,url)}"><section th:replace="~{fragments :: formErrors(${form})}"></section><input type="hidden" name="orderVersion" th:value="${form.value('orderVersion',order.version)}"><input type="hidden" name="lineId" th:value="${line.id}"><input type="hidden" name="lineVersion" th:value="${form.value('lineVersion',line.version)}"><input type="hidden" name="reservationId" th:value="${r.id}"><label th:for="${'release-quantity-'+r.id}">Quantity to release</label><input th:id="${'release-quantity-'+r.id}" name="quantity" type="number" step="0.000001" min="0.000001" required th:value="${form.value('quantity','')}"><label th:for="${'release-intent-'+r.id}">Unique release key</label><input th:id="${'release-intent-'+r.id}" name="intent" maxlength="120" required th:value="${form.value('intent','')}"><button>Release</button></form></div></section>
<section th:replace="~{fragments :: formFallback(${feedback})}"></section></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
