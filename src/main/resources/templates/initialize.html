<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Initialize workspace')}"></head><body><header th:replace="~{fragments :: header('Initialize workspace')}"></header><main id="main"><h1>Initialize workspace</h1><p>Initialization is explicit and applies to the selected entity. O2C goods requires an empty workspace and EUR entity. EMPTY does not create an opening balance.</p><form method="post" th:action="@{${contextBase} + '/initialize'}" th:with="form=${feedback.form('initialize',contextBase+'/initialize')}"><section th:replace="~{fragments :: formErrors(${form})}"></section><input type="hidden" name="version" th:value="${form.value('version',version)}"><label>Baseline <select name="baselineKey" th:id="${form.id('baselineKey')}" th:attr="aria-invalid=${form.invalid('baselineKey') ? 'true' : null},aria-describedby=${form.invalid('baselineKey') ? form.errorId('baselineKey') : null}"><option value="EMPTY" th:selected="${form.selected('baselineKey','EMPTY','EMPTY')}">Empty</option><option value="O2C_GOODS" th:selected="${form.selected('baselineKey','O2C_GOODS','EMPTY')}">O2C goods</option></select></label><p th:replace="~{fragments :: fieldError(${form}, 'baselineKey', 0)}"></p><button>Initialize</button></form><a th:href="@{${contextBase} + '/finance'}">Back to finance</a><section th:replace="~{fragments :: formFallback(${feedback})}"></section></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
