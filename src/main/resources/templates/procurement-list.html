<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Procurement')}"></head><body><header th:replace="~{fragments :: header('Procurement')}"></header><main id="main"><p><a th:href="${base + '/orders'}">Purchase orders</a> | <a th:href="${base + '/receipts'}">Receipts and acceptances</a> | <a th:href="${base + '/vendor-invoices'}">Vendor invoices</a></p><h2>Purchase requests</h2><form method="get" th:action="@{${base}}"><label for="q">Search requests</label><input id="q" name="q" th:value="${q}"><label for="status">Status</label><select id="status" name="status"><option value="">All</option><option th:each="s : ${ {'DRAFT','SUBMITTED','APPROVED','REJECTED'} }" th:value="${s}" th:text="${s}" th:selected="${status == s}"></option></select><button>Search</button></form><p><a th:href="${base + '/requests/new'}">New purchase request</a></p><table><thead><tr><th>Number</th><th>Purpose</th><th>Date</th><th>Revision</th><th>Status</th></tr></thead><tbody><tr th:each="row : ${requests}"><td><a th:href="${base + '/requests/' + row.id}" th:text="${row.number}"></a></td><td th:text="${row.purpose}"></td><td th:text="${row.businessDate}"></td><td th:text="${row.revision}"></td><td th:text="${row.status}"></td></tr></tbody></table></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
