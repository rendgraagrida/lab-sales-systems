<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Asset detail')}"></head><body><header th:replace="~{fragments :: header('Asset detail')}"></header><main id="main"><h2 th:text="${asset.record_key}"></h2><p th:text="${'Serial: ' + asset.serial + ' / product: ' + asset.sku + ' / owner: ' + asset.erp_code + ' / origin: ' + asset.origin}"></p><p th:text="${'Shipment tracking: ' + asset.shipment_tracking_id + ' / source order line: ' + asset.source_order_line_id + ' / device unit: ' + asset.device_unit_no}"></p><h3>Installation history</h3><ul><li th:each="h : ${history}" th:text="${h.business_date + ' / ' + h.completion_reference + ' / ' + h.reason}"></li></ul><h3>Service obligations</h3><ul><li th:each="o : ${obligations}" th:text="${'ID ' + o.id + ' / ' + o.kind + ' / ' + o.status + ' / order line ' + o.order_line_id + ' unit ' + o.unit_no}"></li></ul><h3>Complete installation or paid onboarding</h3><p>Operations may leave the obligation blank for installation without paid onboarding. For already installed assets, select a ready onboarding obligation without creating another installation event.</p><form method="post" th:action="${base + '/' + asset.id + '/complete'}" th:with="form=${feedback.form('asset-complete',base+'/'+asset.id+'/complete')}"><section th:replace="~{fragments :: formErrors(${form})}"></section><input type="hidden" name="version" th:value="${form.value('version',asset.version)}"><label th:for="${form.id('targetId')}">Onboarding obligation</label><select name="targetId" th:id="${form.id('targetId')}"><option value="">None</option><option th:each="o : ${obligations}" th:if="${o.kind == 'ONBOARDING' and o.status == 'READY'}" th:value="${o.id}" th:selected="${form.value('targetId','') == '' + o.id}" th:text="${'Order line ' + o.order_line_id + ' unit ' + o.unit_no + ' / obligation ' + o.id}"></option></select><p th:replace="~{fragments :: fieldError(${form},'targetId',0)}"></p><label th:for="${form.id('date')}">Completion date</label><input name="date" type="date" required th:id="${form.id('date')}" th:value="${form.value('date','')}"><p th:replace="~{fragments :: fieldError(${form},'date',0)}"></p><label th:for="${form.id('postingDate')}">Posting date</label><input name="postingDate" type="date" required th:id="${form.id('postingDate')}" th:value="${form.value('postingDate','')}"><p th:replace="~{fragments :: fieldError(${form},'postingDate',0)}"></p><label th:for="${form.id('reference')}">Completion reference</label><input name="reference" required th:id="${form.id('reference')}" th:value="${form.value('reference','')}"><p th:replace="~{fragments :: fieldError(${form},'reference',0)}"></p><label th:for="${form.id('reason')}">Reason</label><input name="reason" required th:id="${form.id('reason')}" th:value="${form.value('reason','')}"><p th:replace="~{fragments :: fieldError(${form},'reason',0)}"></p><label th:for="${form.id('intent')}">Completion intent key</label><input name="intent" required th:id="${form.id('intent')}" th:value="${form.value('intent','')}"><p th:replace="~{fragments :: fieldError(${form},'intent',0)}"></p><button>Complete</button></form><section th:replace="~{fragments :: formFallback(${feedback})}"></section></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
