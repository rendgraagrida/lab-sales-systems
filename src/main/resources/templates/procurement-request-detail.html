<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Purchase request')}"></head><body><header th:replace="~{fragments :: header('Purchase request')}"></header><main id="main"><p><a th:href="${base}">Back to procurement</a></p><h2 th:text="${purchaseRequest.number}"></h2><p th:text="${purchaseRequest.status + ' / revision ' + purchaseRequest.revision}"></p><p th:text="${purchaseRequest.businessDate + ' — ' + purchaseRequest.purpose}"></p><table><thead><tr><th>Line</th><th>SKU</th><th>Product</th><th>Quantity</th></tr></thead><tbody><tr th:each="line : ${lines}"><td th:text="${line.key}"></td><td th:text="${line.sku}"></td><td th:text="${line.name}"></td><td th:text="${line.quantity}"></td></tr></tbody></table>
<div th:if="${purchaseRequest.status == 'DRAFT'}"><p><a th:href="${base + '/requests/' + purchaseRequest.id + '/edit'}">Edit draft</a></p><form method="post" th:action="${base + '/requests/' + purchaseRequest.id + '/submit'}" th:with="form=${feedback.form('request-submit',base+'/requests/'+purchaseRequest.id+'/submit')}"><section th:replace="~{fragments :: formErrors(${form})}"></section><input type="hidden" name="version" th:value="${form.value('version',purchaseRequest.version)}"><button>Submit for approval</button></form></div>
<div th:if="${purchaseRequest.status == 'SUBMITTED'}"><form method="post" th:action="${base + '/requests/' + purchaseRequest.id + '/approve'}" th:with="form=${feedback.form('request-approve',base+'/requests/'+purchaseRequest.id+'/approve')}"><section th:replace="~{fragments :: formErrors(${form})}"></section><input type="hidden" name="version" th:value="${form.value('version',purchaseRequest.version)}"><label th:for="${form.id('reason')}">Approval note</label><input name="reason" maxlength="500" th:id="${form.id('reason')}" th:value="${form.value('reason','')}"><button>Approve (Finance)</button></form><form method="post" th:action="${base + '/requests/' + purchaseRequest.id + '/reject'}" th:with="form=${feedback.form('request-reject',base+'/requests/'+purchaseRequest.id+'/reject')}"><section th:replace="~{fragments :: formErrors(${form})}"></section><input type="hidden" name="version" th:value="${form.value('version',purchaseRequest.version)}"><label th:for="${form.id('reason')}">Rejection reason</label><input name="reason" required maxlength="500" th:id="${form.id('reason')}" th:value="${form.value('reason','')}"><button>Reject (Finance)</button></form></div>
<form th:if="${purchaseRequest.status == 'APPROVED' or purchaseRequest.status == 'REJECTED'}" method="post" th:action="${base + '/requests/' + purchaseRequest.id + '/revise'}" th:with="form=${feedback.form('request-revise',base+'/requests/'+purchaseRequest.id+'/revise')}"><section th:replace="~{fragments :: formErrors(${form})}"></section><input type="hidden" name="version" th:value="${form.value('version',purchaseRequest.version)}"><button>Create revision</button></form><section th:replace="~{fragments :: formFallback(${feedback})}"></section></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
