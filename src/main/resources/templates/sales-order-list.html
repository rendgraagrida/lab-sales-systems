<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Sales orders')}"></head><body><header th:replace="~{fragments :: header('Sales orders')}"></header><main id="main"><h2>Sales orders</h2><form method="get" th:action="${base}"><label for="q">Search</label><input id="q" name="q" th:value="${q}"><button>Search</button></form><table><thead><tr><th>Number</th><th>Business date</th><th>Currency</th><th>Customer reference</th></tr></thead><tbody><tr th:each="o : ${orders}"><td><a th:href="${base + '/' + o.id}" th:text="${o.number}"></a></td><td th:text="${o.business_date}"></td><td th:text="${o.currency}"></td><td th:text="${o.accepted_reference}"></td></tr></tbody></table></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
