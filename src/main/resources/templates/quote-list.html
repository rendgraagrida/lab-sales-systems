<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Quotes')}"></head><body><header th:replace="~{fragments :: header('Quotes')}"></header><main id="main"><h2>Quotes</h2><p><a th:href="${base + '/new'}">New quote</a></p><form method="get" th:action="${base}"><label for="q">Search</label><input id="q" name="q" th:value="${q}"><button>Search</button></form><table><thead><tr><th>Number</th><th>Origin</th><th>Revision</th><th>Status</th></tr></thead><tbody><tr th:each="row : ${rows}"><td><a th:href="${base + '/' + row.id}" th:text="${row.number}"></a></td><td th:text="${row.origin}"></td><td th:text="${row.revision}"></td><td th:text="${row.status}"></td></tr></tbody></table></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
