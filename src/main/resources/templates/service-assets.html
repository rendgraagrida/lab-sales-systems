<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Assets')}"></head><body><header th:replace="~{fragments :: header('Assets')}"></header><main id="main"><h2>Assets</h2><p>A shipped instrument is not installed until an installation event is recorded.</p><p><a th:href="${base + '/new'}">Register a legacy asset</a></p><table><thead><tr><th>Record</th><th>Serial</th><th>Device</th><th>Owner</th><th>Origin</th><th>Status</th><th>Operators</th></tr></thead><tbody><tr th:each="a : ${assets}"><td><a th:href="${base + '/' + a.id}" th:text="${a.record_key}"></a></td><td th:text="${a.serial}"></td><td th:text="${a.sku}"></td><td th:text="${a.erp_code}"></td><td th:text="${a.origin}"></td><td th:text="${a.asset_status}"></td><td><a th:href="${base + '/' + a.id + '/operators'}">Link operator</a></td></tr></tbody></table></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
