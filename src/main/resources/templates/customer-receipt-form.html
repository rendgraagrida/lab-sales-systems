<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Customer receipt')}"></head><body><header th:replace="~{fragments :: header('Customer receipt')}"></header><main id="main"><h1>Customer receipt draft</h1><p>Allocations must exactly equal the receipt. No actual payment is made.</p><form method="get" th:action="${action}"><label>Number of allocations <input type="number" name="count" min="1" max="100" th:value="${lineCount}" required></label><button>Set count</button></form>
<details><summary>Customer account versions</summary><ul><li th:each="c : ${customers}" th:text="${'Account '+c.id+', version '+c.version}"></li></ul></details><details><summary>Posted invoices</summary><ul><li th:each="i : ${invoices}" th:text="${i.id+' - '+i.reference+' customer '+i.customer_account_id+' '+i.currency}"></li></ul></details><details><summary>Posting configuration versions</summary><ul><li th:each="c : ${configs}" th:text="${'Sales '+c.config_version+', payment '+c.payment_config_version}"></li></ul></details>
<form method="post" th:action="${action}" th:with="form=${feedback.form('customer-receipt',action)}"><section th:replace="~{fragments :: formErrors(${form})}"></section><input type="hidden" name="version" th:id="${form.id('version')}" th:value="${form.value('version',header.version == null ? 0 : header.version)}">
<label>Receipt reference <input name="receiptKey" maxlength="120" required th:id="${form.id('receiptKey')}" th:value="${form.value('receiptKey',header.receipt_key)}" th:attr="aria-invalid=${form.invalid('receiptKey') ? 'true' : null},aria-describedby=${form.invalid('receiptKey') ? form.errorId('receiptKey') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'receiptKey', 0)}"></p>
<label>Customer account ID <input type="number" min="1" name="customerAccountId" required th:id="${form.id('customerAccountId')}" th:value="${form.value('customerAccountId',header.customer_account_id)}" th:attr="aria-invalid=${form.invalid('customerAccountId') ? 'true' : null},aria-describedby=${form.invalid('customerAccountId') ? form.errorId('customerAccountId') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'customerAccountId', 0)}"></p>
<label>Customer version <input type="number" min="1" name="customerVersion" required th:id="${form.id('customerVersion')}" th:value="${form.value('customerVersion',header.customer_account_version)}" th:attr="aria-invalid=${form.invalid('customerVersion') ? 'true' : null},aria-describedby=${form.invalid('customerVersion') ? form.errorId('customerVersion') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'customerVersion', 0)}"></p>
<label>Sales configuration version <input type="number" min="1" name="configVersion" required th:id="${form.id('configVersion')}" th:value="${form.value('configVersion',header.config_version)}" th:attr="aria-invalid=${form.invalid('configVersion') ? 'true' : null},aria-describedby=${form.invalid('configVersion') ? form.errorId('configVersion') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'configVersion', 0)}"></p>
<label>Payment configuration version <input type="number" min="1" name="paymentConfigVersion" required th:id="${form.id('paymentConfigVersion')}" th:value="${form.value('paymentConfigVersion',header.payment_config_version)}" th:attr="aria-invalid=${form.invalid('paymentConfigVersion') ? 'true' : null},aria-describedby=${form.invalid('paymentConfigVersion') ? form.errorId('paymentConfigVersion') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'paymentConfigVersion', 0)}"></p>
<label>Payment date <input type="date" name="paymentDate" required th:id="${form.id('paymentDate')}" th:value="${form.value('paymentDate',header.payment_date)}" th:attr="aria-invalid=${form.invalid('paymentDate') ? 'true' : null},aria-describedby=${form.invalid('paymentDate') ? form.errorId('paymentDate') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'paymentDate', 0)}"></p>
<label>Currency <input name="currency" readonly th:id="${form.id('currency')}" th:value="${form.value('currency',header.currency == null ? entityCurrency : header.currency)}" th:attr="aria-invalid=${form.invalid('currency') ? 'true' : null},aria-describedby=${form.invalid('currency') ? form.errorId('currency') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'currency', 0)}"></p>
<label>Amount <input type="number" min="0.01" step="0.01" name="amount" required th:id="${form.id('amount')}" th:value="${form.value('amount',header.amount)}" th:attr="aria-invalid=${form.invalid('amount') ? 'true' : null},aria-describedby=${form.invalid('amount') ? form.errorId('amount') : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'amount', 0)}"></p>
<fieldset th:each="i : ${#numbers.sequence(0,lineCount - 1)}" th:with="row=${i &lt; lines.size() ? lines[i] : null}"><legend th:text="${'Allocation '+(i+1)}"></legend>
<label>Invoice ID <input type="number" min="1" name="invoiceId" required th:id="${form.id('invoiceId',i)}" th:value="${form.value('invoiceId',i,row == null ? '' : row.invoice_id)}" th:attr="aria-invalid=${form.invalid('invoiceId',i) ? 'true' : null},aria-describedby=${form.invalid('invoiceId',i) ? form.errorId('invoiceId',i) : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'invoiceId', ${i})}"></p>
<label>Amount <input type="number" min="0.01" step="0.01" name="allocationAmount" required th:id="${form.id('allocationAmount',i)}" th:value="${form.value('allocationAmount',i,row == null ? '' : row.amount)}" th:attr="aria-invalid=${form.invalid('allocationAmount',i) ? 'true' : null},aria-describedby=${form.invalid('allocationAmount',i) ? form.errorId('allocationAmount',i) : null}"></label><p th:replace="~{fragments :: fieldError(${form}, 'allocationAmount', ${i})}"></p></fieldset><button>Save draft</button></form><section th:replace="~{fragments :: formFallback(${feedback})}"></section><a th:href="@{${contextBase}+'/finance/customer-receipts'}">Receipts</a></main><footer th:replace="~{fragments :: footer()}"></footer></body></html>
