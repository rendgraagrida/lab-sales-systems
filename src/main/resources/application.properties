spring.application.name=lab-sales-systems
server.address=${LAB_BIND_ADDRESS:127.0.0.1}
server.port=${LAB_PORT:8187}
# Full quote create/edit forms submit at most 1913 parameters (100 lines and 100 service targets).
server.tomcat.max-parameter-count=2048
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.timeout=30m
spring.datasource.url=${LAB_DB_URL}
spring.datasource.username=${LAB_DB_USER}
spring.datasource.password=${LAB_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.connection-init-sql=SET search_path TO app, pg_catalog
spring.sql.init.mode=never
spring.flyway.enabled=false
spring.thymeleaf.cache=true
lab.revision=${LAB_REVISION}
spring.mvc.log-request-details=false
logging.level.root=INFO
logging.level.org.springframework.security=WARN
